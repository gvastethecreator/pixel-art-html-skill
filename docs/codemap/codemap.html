(self) -> None:\n        try:\n            from PIL import Image\n        except ImportError:\n            self.skipTest(\"Pillow not installed\")\n        with tempfile.TemporaryDirectory() as temp:\n            root = Path(temp)\n            source = root / \"source.png\"\n            output = root / \"output\"\n            Image.new(\"RGBA\", (8, 8), (40, 50, 60, 255)).resize((40, 40), Image.Resampling.NEAREST).save(source)\n            fake = root / \"fake_fixer.py\"\n            fake.write_text(\n                \"import json\\nfrom pathlib import Path\\n\"\n                \"counter = Path(__file__).with_suffix('.count')\\n\"\n                \"counter.write_text(str(int(counter.read_text()) + 1) if counter.exists() else '1')\\n\"\n                \"print(json.dumps({'cols': 8, 'rows': 8, 'step_x': 5.0, 'step_y': 5.0, 'consensus': 'cached-once'}))\\n\",\n                encoding=\"utf-8\",\n            )\n            completed = subprocess.run(\n                [\n                    sys.executable, str(MODULE_PATH), \"from-image\", str(source),\n                    \"--sizes\", \"8,16\", \"--colors\", \"4\", \"--pixel-fixer-bin\", str(fake),\n                    \"--output\", str(output),\n                ],\n                capture_output=True,\n                text=True,\n                check=False,\n            )\n            self.assertEqual(completed.returncode, 0, completed.stderr)\n            self.assertEqual(fake.with_suffix(\".count\").read_text(encoding=\"utf-8\"), \"1\")\n            manifest = json.loads((output / \"manifest.json\").read_text(encoding=\"utf-8\"))\n            self.assertEqual([item[\"path\"] for item in manifest[\"items\"]], [\"8x8\", \"16x16\"])\n\n    def test_managed_iterations_are_numbered_and_hubbed(self) -> None:\n        artifact = module.compile_spec({\"title\": \"Night Beacon\", \"width\": 8, \"height\": 8, \"background\": \"#123\"})\n        moment = datetime(2026, 7, 11, 12, 0, tzinfo=timezone.utc)\n        with tempfile.TemporaryDirectory() as temp:\n            root = Path(temp)\n            args = type(\"Args\", (), {\"output\": None, \"project_root\": root, \"slug\": None})()\n            first, library = module.resolve_output(args, artifact[\"title\"], moment)\n            self.assertEqual(first.relative_to(root).as_posix(), \"pixel-art/2026/07/001-night-beacon\")\n            module.write_artifact(artifact, first, 4)\n            result = module.validate_output(first)\n            metadata = module.iteration_metadata(result, first, library, moment)\n            (first / \"iteration.json\").write_text(json.dumps(metadata), encoding=\"utf-8\")\n            second, _ = module.resolve_output(args, artifact[\"title\"], moment)\n            self.assertEqual(second.name, \"002-night-beacon\")\n            catalog = module.rebuild_project_hub(library)\n            self.assertEqual(catalog[\"count\"], 1)\n            self.assertEqual(catalog[\"items\"][0][\"entry\"], \"2026/07/001-night-beacon/index.html\")\n            hub = (library / \"index.html\").read_text(encoding=\"utf-8\")\n            self.assertNotIn(\"__HUB_JSON__\", hub)\n            self.assertNotIn(\"https://\", hub)\n\n    def test_collection_metadata_prefers_32_thumbnail(self) -> None:\n        artifacts = [module.compile_spec({\"title\": str(size), \"width\": size, \"height\": size, \"background\": \"#123\"}) for size in (16, 32, 64)]\n        with tempfile.TemporaryDirectory() as temp:\n            library = Path(temp) / \"pixel-art\"\n            output = library / \"2026\" / \"07\" / \"001-set\"\n            result = module.write_collection(artifacts, output, 2, \"Scale set\")\n            metadata = module.iteration_metadata(result, output, library)\n            self.assertEqual(metadata[\"thumbnail\"], \"2026/07/001-set/32x32/pixel-art.png\")\n            self.assertEqual(metadata[\"sizes\"], [\"16x16\", \"32x32\", \"64x64\"])\n\n\n    def lab_case(self):\n        artifact = module.compile_spec({\n            \"title\": \"Repair case\", \"width\": 8, \"height\": 8,\n            \"palette\": {\"a\": \"#123\", \"b\": \"#abc\"},\n            \"rects\": [{\"x\": 2, \"y\": 2, \"width\": 3, \"height\": 3, \"color\": \"a\"}],\n            \"pixels\": [{\"x\": 3, \"y\": 3, \"color\": \"b\"}],\n            \"art_direction\": {\"use\": \"prop\", \"light\": \"upper left\"},\n        })\n        patch = {\"base_fingerprint\": module.artifact_fingerprint(artifact),\n                 \"hypothesis\": \"Open the upper-left corner and connect its adjacent light to the center.\",\n                 \"max_colors\": 2, \"protected_regions\": [[3, 3, 1, 1]],\n                 \"repair_decisions\": {\"silhouette\": \"Open corner\", \"identity_cue\": \"Keep center\", \"subtraction\": \"Remove one cell\"},\n                 \"edits\": [{\"x\": 2, \"y\": 2, \"before\": \"#112233\", \"after\": None},\n                           {\"x\": 3, \"y\": 2, \"before\": \"#112233\", \"after\": \"#AABBCC\"}]}\n        return artifact, patch\n\n    def test_pixel_lab_reports_native_coordinates_and_diagonal_connectivity(self):\n        artifact = module.compile_spec({\"width\": 8, \"height\": 8, \"pixels\": [\n            {\"x\": 2, \"y\": 2, \"color\": \"#123\"}, {\"x\": 3, \"y\": 3, \"color\": \"#123\"},\n            {\"x\": 6, \"y\": 5, \"color\": \"#abc\"}]})\n        report = pixel_lab.inspect_artifact(artifact, [2, 2, 2, 2])\n        self.assertEqual(report[\"rows\"][1], {\"y\": 3, \"x_start\": 2, \"cells\": [\".\", \"p0\"]})\n        self.assertEqual(report[\"total_clusters_in_region\"], 1)\n        self.assertEqual(report[\"small_clusters\"][0][\"cells\"], [[2, 2], [3, 3]])\n        self.assertEqual(len(pixel_lab.cluster_locations(artifact)), artifact[\"quality\"][\"clusters\"])\n\n    @requires_pillow\n    def test_pixel_lab_loupe_preserves_native_cells_and_comparison_coordinates(self):\n        from PIL import Image\n        artifact, patch = self.lab_case()\n        repaired, _ = pixel_lab.apply_patch(artifact, patch)\n        with tempfile.TemporaryDirectory() as temp:\n            root = Path(temp)\n            before, after = root / \"before.json\", root / \"after.json\"\n            before.write_text(json.dumps(artifact), encoding=\"utf-8\")\n            after.write_text(json.dumps(repaired), encoding=\"utf-8\")\n            originals = [p.read_bytes() for p in (before, after)]\n            command = [sys.executable, str(MODULE_PATH.with_name(\"pixel_lab.py\")), \"loupe\", str(before),\n                       \"--compare\", str(after), \"--region\", \"2\", \"2\", \"2\", \"2\", \"--output\", str(root / \"loupe.png\")]\n            result = subprocess.run(command, capture_output=True, text=True)\n            self.assertEqual(result.returncode, 0, result.stderr)\n            receipt = json.loads((root / \"loupe.json\").read_text())\n            self.assertEqual(receipt[\"region\"], [2, 2, 2, 2])\n            with Image.open(root / \"loupe.png\") as image:\n                for index, current in enumerate((artifact, repaired)):\n                    panel = receipt[\"panels\"][index]\n                    self.assertEqual(panel[\"fingerprint\"], module.artifact_fingerprint(current))\n                    ox, oy = panel[\"roi_image_origin_xy\"]\n                    for dy, row in enumerate(panel[\"rows\"]):\n                        self.assertEqual((row[\"y\"], row[\"x_start\"]), (2 + dy, 2))\n                        for dx, alias in enumerate(row[\"cells\"]):\n                            color = current[\"grid\"][2 + dy][2 + dx]\n                            self.assertEqual(receipt[\"legend\"][alias], color)\n                            expected = color or receipt[\"display_background\"]\n                            rgb = tuple(int(expected[i:i + 2], 16) for i in (1, 3, 5))\n                            self.assertEqual(image.getpixel((ox + dx * receipt[\"cell_pitch\"] + 8,\n                                                            oy + dy * receipt[\"cell_pitch\"] + 8)), rgb)\n            self.assertEqual([p.read_bytes() for p in (before, after)], originals)\n            retry = subprocess.run(command, capture_output=True, text=True)\n            self.assertNotEqual(retry.returncode, 0)\n            self.assertIn(\"new diagnostic\", retry.stderr)\n\n    def test_pixel_lab_cli_writes_valid_repair_without_changing_baseline(self):\n        artifact, patch = self.lab_case()\n        with tempfile.TemporaryDirectory() as temp:\n            root = Path(temp)\n            baseline, output = root / \"baseline\", root / \"repair\"\n            module.write_artifact(artifact, baseline, 2)\n            original = (baseline / \"pixel-art.json\").read_bytes()\n            patch_path = root / \"patch.json\"\n            patch_path.write_text(json.dumps(patch), encoding=\"utf-8\")\n            command = [sys.executable, str(MODULE_PATH.with_name(\"pixel_lab.py\")), \"patch\", str(baseline), str(patch_path), \"--output\", str(output), \"--scale\", \"1\"]\n            result = subprocess.run(command, capture_output=True, text=True)\n            self.assertEqual(result.returncode, 0, result.stderr)\n            repaired = module.validate_output(output)\n            self.assertEqual(repaired[\"evidence_tier\"], \"draft\")\n            png_header = (output / \"pixel-art.png\").read_bytes()\n            self.assertEqual((int.from_bytes(png_header[16:20], \"big\"), int.from_bytes(png_header[20:24], \"big\")),\n                             (repaired[\"width\"], repaired[\"height\"]))\n            self.assertIsNone(repaired[\"grid\"][2][2])\n            self.assertEqual(repaired[\"grid\"][2][3], \"#AABBCC\")\n            self.assertEqual(repaired[\"source\"][\"art_direction\"], artifact[\"source\"][\"art_direction\"])\n            self.assertEqual(json.loads((output / \"delta.json\").read_text())[\"changed_cells\"], 2)\n            self.assertEqual((baseline / \"pixel-art.json\").read_bytes(), original)\n            retry = subprocess.run(command, capture_output=True, text=True)\n            self.assertNotEqual(retry.returncode, 0)\n            self.assertIn(\"new directory\", retry.stderr)\n\n    def test_pixel_lab_rejects_stale_grid_and_wrong_cell(self):\n        for field in (\"fingerprint\", \"before\"):\n            artifact, patch = self.lab_case()\n            with self.subTest(field=field):\n                if field == \"fingerprint\":\n                    patch[\"base_fingerprint\"] = \"stale\"\n                else:\n                    patch[\"edits\"][0][\"before\"] = \"#000000\"\n                original = json.dumps(artifact)\n                with self.assertRaisesRegex(ValueError, \"does not match\"):\n                    pixel_lab.apply_patch(artifact, patch)\n                self.assertEqual(json.dumps(artifact), original)\n\n    def test_pixel_lab_protects_declared_region(self):\n        artifact, patch = self.lab_case()\n        patch[\"protected_regions\"] = [[2, 2, 1, 1]]\n        with self.assertRaisesRegex(ValueError, \"protected region\"):\n            pixel_lab.apply_patch(artifact, patch)\n\n    def test_pixel_lab_enforces_palette_budget(self):\n        artifact, patch = self.lab_case()\n        patch[\"edits\"][1][\"after\"] = \"#FF0000\"\n        with self.assertRaisesRegex(ValueError, \"max_colors\"):\n            pixel_lab.apply_patch(artifact, patch)\n\n    def test_pixel_lab_rejects_ambiguous_or_outside_coordinates(self):\n        for x in (2.5, True, -1, 8):\n            artifact, patch = self.lab_case()\n            patch[\"edits\"][0][\"x\"] = x\n            with self.subTest(x=x), self.assertRaises(ValueError):\n                pixel_lab.apply_patch(artifact, patch)\n        artifact, patch = self.lab_case()\n        patch[\"edits\"].append(patch[\"edits\"][0])\n        with self.assertRaisesRegex(ValueError, \"Repeated edit\"):\n            pixel_lab.apply_patch(artifact, patch)\n\n    @requires_pillow\n    def test_reference_index_searches_captions_and_full_text_before_deduplication(self):\n        from PIL import Image\n        with tempfile.TemporaryDirectory() as temp:\n            root = Path(temp) / \"corpus\"\n            chapter = root / \"44-trees\"\n            images = chapter / \"images\"\n            images.mkdir(parents=True)\n            Image.new(\"RGB\", (8, 8), \"green\").save(images / \"01.png\")\n            (root / \"copy.png\").write_bytes((images / \"01.png\").read_bytes())\n            (chapter / \"article.html\").write_text('<figure><img src=\"images/01.png\"><figcaption>https://example.com/Leaf_Bundle.png<\/figcaption><\/figure>', encoding=\"utf-8\")\n            (chapter / \"notes.md\").write_text(\"ordinary text \" * 2000 + \"late-stage-construction\", encoding=\"utf-8\")\n            index = reference_library.index_library({\"wiki\": root})\n            self.assertEqual(index[\"coverage\"][\"files\"], 4)\n            self.assertEqual(index[\"coverage\"][\"exact_duplicates\"], 1)\n            matches = reference_library.search_entries(index, \"leaf\", kind=\"image\")\n            self.assertEqual(matches[0][\"path\"], \"44-trees/images/01.png\")\n            self.assertEqual(len(reference_library.search_entries(index, \"late-stage-construction\", kind=\"text\")), 1)\n            self.assertEqual(len(reference_library.search_entries(index, \"\", kind=\"image\")), 1)\n            self.assertEqual(len(reference_library.search_entries(index, \"\", kind=\"image\", duplicates=True)), 2)\n\n    @requires_pillow\n    def test_reference_samples_reach_the_second_frame_of_a_two_frame_gif(self):\n        from PIL import Image\n        with tempfile.TemporaryDirectory() as temp:\n            root = Path(temp)\n            corpus = root / \"corpus\"\n            corpus.mkdir()\n            path = corpus / \"process.gif\"\n            Image.new(\"RGB\", (8, 8), \"red\").save(path, save_all=True, append_images=[Image.new(\"RGB\", (8, 8), \"blue\")], duration=[100, 100], loop=0)\n            picture, sample = reference_library.sample_image(path, \"image\", .5)\n            self.assertEqual(sample[\"frame\"], 1)\n            self.assertEqual(picture.getpixel((0, 0)), (0, 0, 255, 255))\n            index = reference_library.index_library({\"study\": corpus})\n            report = reference_library.make_board(index, index[\"entries\"], root / \"board.png\", (0, .95), 2)\n            self.assertEqual([r[\"frame\"] for r in report[\"samples\"]], [0, 1])\n            self.assertEqual(report[\"errors\"], 0)\n            with Image.open(root / \"board.png\") as board:\n                self.assertEqual(board.size, (480, 200))\n\n    @requires_pillow\n    def test_reference_board_rejects_source_drift_and_source_output_paths(self):\n        from PIL import Image\n        with tempfile.TemporaryDirectory() as temp:\n            root = Path(temp)\n            corpus = root / \"corpus\"\n            corpus.mkdir()\n            path = corpus / \"source.png\"\n            Image.new(\"RGB\", (8, 8), \"red\").save(path)\n            index = reference_library.index_library({\"study\": corpus})\n            with self.assertRaisesRegex(ValueError, \"outside every source root\"):\n                reference_library.make_board(index, index[\"entries\"], path)\n            Image.new(\"RGB\", (8, 8), \"blue\").save(path)\n            report = reference_library.make_board(index, index[\"entries\"], root / \"board.png\")\n            self.assertEqual(report[\"errors\"], 1)\n            self.assertIn(\"changed after indexing\", report[\"samples\"][0][\"error\"])","start_line":30,"end_line":1193,"extractor":"python-ast","source_digest":"095c5d514cc55a825c0b6f51002e81a7d3e4072951b0e228801e51146d1a370d","kind":"definition"},{"path":"SKILLS/pixel-art-html/scripts/test_build_pixel_art.py","symbol":"class SceneTests(unittest.TestCase):\n    def test_scene_depth_flip_transparency_and_native_export(self):\n        with tempfile.TemporaryDirectory() as temp:\n            root = Path(temp)\n            master = module. ncoding='utf-8')\n            spec = {'width': 8, 'height': 8, 'background': None, 'palette_budget': 1,\n                    'assets': {'a': 'asset.json'}, 'placements': [{'asset': 'a', 'x': 0, 'y': 0, 'depth': 0}]}\n            scene = compose_scene.compile_scene(spec, root)\n            compose_scene.write_scene(scene, root / 'result')\n            page = root / 'result/index.html'\n            original = page.read_text(encoding='utf-8')\n            page.write_text(original.replace('\"title\":\"Pixel scene\"', '\"title\":\"Changed scene\"'), encoding='utf-8')\n            with self.assertRaisesRegex(module.ArtifactError, 'payload differs'):\n                compose_scene.validate_output(root / 'result')\n            page.write_text(original, encoding='utf-8')\n            module.write_png({'width': 8, 'height': 8, 'grid': [['#FFFFFF'] * 8 for _ in range(8)]}, root / 'result/scene.png', 1)\n            with self.assertRaises(module.ArtifactError):\n                compose_scene.validate_output(root / 'result')","start_line":1196,"end_line":1242,"extractor":"python-ast","source_digest":"095c5d514cc55a825c0b6f51002e81a7d3e4072951b0e228801e51146d1a370d","kind":"definition"}]},"callers":[],"callees":[{"id":"external:python:PIL","type":"imports","type_only":false},{"id":"external:python:__future__","type":"imports","type_only":false},{"id":"external:python:compose_scene","type":"calls","type_only":false},{"id":"external:python:compose_scene","type":"imports","type_only":false},{"id":"external:python:construct","type":"calls","type_only":false},{"id":"external:python:construct","type":"imports","type_only":false},{"id":"external:python:datetime","type":"calls","type_only":false},{"id":"external:python:datetime","type":"imports","type_only":false},{"id":"external:python:importlib","type":"imports","type_only":false},{"id":"external:python:json","type":"calls","type_only":false},{"id":"external:python:json","type":"imports","type_only":false},{"id":"external:python:pathlib","type":"calls","type_only":false},{"id":"external:python:pathlib","type":"imports","type_only":false},{"id":"external:python:pixel_lab","type":"calls","type_only":false},{"id":"external:python:pixel_lab","type":"imports","type_only":false},{"id":"external:python:reference_library","type":"calls","type_only":false},{"id":"external:python:reference_library","type":"imports","type_only":false},{"id":"external:python:subprocess","type":"calls","type_only":false},{"id":"external:python:subprocess","type":"imports","type_only":false},{"id":"external:python:sys","type":"imports","type_only":false},{"id":"external:python:tempfile","type":"calls","type_only":false},{"id":"external:python:tempfile","type":"imports","type_only":false},{"id":"external:python:unittest","type":"calls","type_only":false},{"id":"external:python:unittest","type":"imports","type_only":false}],"parent":"SKILLS/pixel-art-html/scripts"},{"id":"SKILLS/pixel-art-html/scripts/test_interpretation.py","path":"SKILLS/pixel-art-html/scripts/test_interpretation.py","label":"test_interpretation.py","type":"module","boundary":"Repository","entrypoints":[],"tests":[],"test_evidence":[],"analysis":"analyzed","is_test":true,"symbols":["AdditionalBoundaryTests","InterpretationTests","MetadataTests","RoutingTests","RunnerIntegrationTests"],"evidence":{"status":"verified","locations":[{"path":"SKILLS/pixel-art-html/scripts/test_interpretation.py","symbol":"class InterpretationTests(unittest.TestCase):\n    def test_positive_noise(self):\n        self.assertEqual(ip.interpret('tiene ruido')['active_issues'], ['texture-noise'])\n\n    def test_negative_noise(self):\n        r=ip.interpret('no tiene ruido')\n        self.assertEqual(r['active_issues'], [])\n        self.assertEqual(r['ruled_out_issues'], ['texture-noise'])\n\n    def test_accented_canopy(self):\n        r=ip.interpret('Árbol parece coliflor')\n        self.assertEqual(r['active_issues'], ['canopy-construction'])\n        self.assertEqual(r['filters']['subject'], 'foliage')\n\n    def test_negative_canopy(self):\n        self.assertEqual(ip.interpret('árbol no parece coliflor')['active_issues'], [])\n\n    def test_contrast_scope(self):\n        r=ip.interpret('no tiene ruido pero la pose es rígida')\n        self.assertEqual(r['active_issues'], ['pose-rigidity'])\n        self.assertEqual(r['ruled_out_issues'], ['texture-noise'])\n\n    def test_conjunction_scope(self):\n        r=ip.interpret('no tiene ruido y la pose es rígida')\n        self.assertEqual(r['active_issues'], ['pose-rigidity'])\n\n    def test_negative_capability(self):\n        self.assertIn('weapon-ownership',ip.interpret('no se entiende a quién pertenece el arma')['active_issues'])\n\n    def test_negative_readability(self):\n        self.assertEqual(ip.interpret('la silueta no se entiende')['active_issues'],['silhouette-read'])\n\n    def test_negated_ownership_problem(self):\n        self.assertEqual(ip.interpret('no hay problema de propiedad del arma')['active_issues'],[])\n\n    def test_question(self):\n        self.assertEqual(ip.interpret('¿Tiene ruido?')['active_issues'],[])\n\n    def test_uncertainty(self):\n        self.assertEqual(ip.interpret('quizás tiene ruido')['active_issues'],[])\n\n    def test_english_uncertainty(self):\n        self.assertEqual(ip.interpret('maybe stiff')['active_issues'],[])\n\n    def test_quote_does_not_become_current_observation(self):\n        self.assertEqual(ip.interpret('El tutorial dice \"tiene ruido y pose rígida\"')['active_issues'],[])\n\n    def test_history(self):\n        self.assertEqual(ip.interpret('antes tenía ruido')['active_issues'],[])\n\n    def test_historical_then_current(self):\n        self.assertEqual(ip.interpret('antes tenía ruido; ahora la pose es rígida')['active_issues'],['pose-rigidity'])\n\n    def test_resolved(self):\n        for text in ('ruido corregido', 'ruido resuelto', 'el ruido está resuelto',\n                     'pose rígida resuelta', 'costuras resueltas', 'r       function fitText(value, probe, maxWidth) {
