<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code map · pixel-art-html-skill</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #050505;
      --paper-2: #101010;
      --pattern: rgba(255, 255, 255, .012);
      --node-paper: #141414;
      --ink: #f5f5f5;
      --muted: #b0b0b0;
      --soft: #8a8a8a;
      --chrome-line: rgba(255, 255, 255, .02);
      --chrome-radius: 12px;
      --rule: rgba(255, 255, 255, .12);
      --rule-solid: #3a3a3a;
      --grid: rgba(255, 255, 255, .035);
      --wash-2: rgba(255, 255, 255, .03);
      --wash-3: rgba(255, 255, 255, .04);
      --wash-6: rgba(255, 255, 255, .07);
      --wash-10: rgba(255, 255, 255, .1);
      --wash-30: rgba(255, 255, 255, .28);
      --accent: #ffffff;
      --accent-tint: rgba(255, 255, 255, .08);
      --link: #4da3ff;
      --connector: #6e6e6e;
      --connector-dim: #2a2a2a;
      --edge-imports: #3d8fff;
      --edge-calls: #c45cff;
      --edge-reads: #3ec2ff;
      --edge-writes: #ffc107;
      --edge-publishes: #ff6a2a;
      --edge-subscribes: #ff3d8a;
      --edge-unknown: #ff3b3b;
      --card-shadow: transparent;
      --boundary-saturation: 64%;
      --boundary-lightness: 47%;
      --sans: "Segoe UI", system-ui, sans-serif;
      --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
      --ease-out: cubic-bezier(.23, 1, .32, 1);
      --ease-in: cubic-bezier(.4, 0, 1, 1);
      --ease-in-out: cubic-bezier(.45, 0, .15, 1);
      --motion-quick: 140ms;
      --motion-panel: 220ms;
      --motion-camera: 280ms;
      --edge-registers: #a5a0ff;
    }

    .skip {
      position: absolute;
      left: 8px;
      top: 8px;
      z-index: 20;
      padding: 6px 10px;
      background: var(--paper-2);
      color: var(--ink);
      border: 1px solid var(--rule-solid);
      transform: translateY(-120%);
    }
    .skip:focus { transform: none; }
    * { box-sizing: border-box; }
    * { scrollbar-color: var(--rule-solid) var(--paper-2); scrollbar-width: thin; }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-track { background: var(--paper-2); }
    *::-webkit-scrollbar-thumb {
      border: 2px solid var(--paper-2);
      background: var(--rule-solid);
    }
    *::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font: 12px/1.45 var(--sans);
    }
    button, input { font: inherit; color: inherit; }
    .eyebrow {
      margin: 0;
      color: var(--soft);
      font: 10px/1.2 var(--mono);
      letter-spacing: .04em;
      text-transform: none;
    }
    header, .eyebrow, .head-right, .meta { display: none; }
    .map-head {
      position: absolute;
      z-index: 5;
      top: 8px;
      left: 8px;
      max-width: min(360px, calc(100% - 280px));
      padding: 10px 12px;
      border: 2px solid var(--chrome-line);
      border-radius: var(--chrome-radius);
      background: color-mix(in srgb, var(--paper) 88%, transparent);
    }
    .map-head h1 { margin: 0; font: 600 16px/1.2 var(--mono); overflow-wrap: anywhere; }
    .map-head .map-meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 4px 0 0; color: var(--soft); font: 12px/1.3 var(--mono); }
    .map-head .map-time { display: none; }
    .card-legend {
      position: absolute;
      z-index: 5;
      left: 8px;
      bottom: 36px;
      min-width: 148px;
      max-width: 240px;
      max-height: 42vh;
      overflow: auto;
      padding: 10px 12px;
      border: 2px solid var(--chrome-line);
      border-radius: var(--chrome-radius);
      background: color-mix(in srgb, var(--paper) 88%, transparent);
    }
    .card-legend .legend-title { margin: 0 0 8px; color: var(--soft); font: 12px/1.2 var(--mono); }
    .card-legend .boundary-chip {
      width: 10px;
      height: 10px;
      border: 0;
      border-radius: 4px;
      background: var(--group-color);
    }
    .left .section:has(#boundary-legend) { display: none; }

    main {
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      position: relative;
    }
    aside {
      position: absolute;
      z-index: 9;
      top: 108px;
      bottom: 60px;
      min-width: 0;
      overflow: auto;
      background: var(--paper-2);
      border: 2px solid var(--chrome-line);
      border-radius: 16px;
      transition: opacity var(--motion-panel) var(--ease-out), transform var(--motion-panel) var(--ease-out), visibility var(--motion-panel);
    }
    main[data-left-collapsed="true"] .left,
    main[data-right-collapsed="true"] .right {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .left { left: 12px; width: 236px; padding: 18px; }
    .right { right: 12px; width: 320px; padding: 20px; user-select: text; }
    main[data-left-collapsed="true"] .left { transform: translateX(-12px); }
    main[data-right-collapsed="true"] .right { transform: translateX(12px); }
    .section { margin-bottom: 14px; }
    .section-title { margin: 0 0 6px; color: var(--soft); font: 10px/1.3 var(--mono); letter-spacing: 0; text-transform: none; }
    input[type="search"] {
      width: 100%;
      height: 28px;
      padding: 0 8px;
      border: 1px solid var(--rule-solid);
      border-radius: 0;
      outline: none;
      background: var(--paper);
      font-family: var(--mono);
    }
    input[type="search"]:focus { border-color: var(--ink); }
    .filter, .legend-row { display: flex; align-items: center; gap: 8px; min-height: 26px; }
    .filter { cursor: pointer; }
    .filter input { accent-color: var(--ink); width: 13px; height: 13px; margin: 0; }
    .filter code, .legend-row code { font: 12px/1 var(--mono); letter-spacing: 0; color: var(--soft); }
    .type-key { width: 72px; flex: 0 0 auto; color: var(--muted); font: 12px/1 var(--mono); letter-spacing: 0; }
    .boundary-chip { width: 12px; height: 12px; flex: 0 0 auto; border: 1px solid var(--group-color); background: color-mix(in srgb, var(--group-color) 18%, var(--paper)); }
    .edge-key { position: relative; width: 20px; height: 8px; flex: 0 0 auto; color: var(--edge-color); }
    .edge-key::before { content: ""; position: absolute; top: 3px; left: 0; width: 15px; border-top: 2px solid currentColor; }
    .edge-key::after { content: ""; position: absolute; top: 1px; right: 0; border-top: 3px solid transparent; border-bottom: 3px solid transparent; border-left: 5px solid currentColor; }
    .rule-chip { width: 16px; height: 0; flex: 0 0 auto; border-top: 2px solid var(--connector); }
    .rule-chip[data-state="selected"] { border-top-color: var(--accent); }
    .rule-chip[data-state="callers"] { border-top-color: var(--link); }
    .rule-chip[data-state="dependencies"] { border-top-color: var(--ink); }
    .rule-chip[data-state="flow"] { border-top-color: var(--accent); }
    .rule-chip[data-state="unknown"] { border-top-style: dashed; border-top-color: var(--edge-unknown); }
    .flow-button {
      width: 100%;
      margin: 0 0 6px;
      padding: 7px 8px;
      border: 1px solid var(--rule-solid);
      border-radius: 0;
      background: var(--paper);
      text-align: left;
      cursor: pointer;
    }
    .flow-button { transition: border-color 140ms ease-out, background-color 140ms ease-out, color 140ms ease-out; }
    .flow-button:hover, .flow-button:focus-visible { border-color: var(--ink); outline: none; }
    .flow-button.active { border-color: var(--ink); background: var(--accent-tint); }
    .flow-button.related { border-color: var(--link); }
    .flow-button small { display: block; margin-top: 4px; color: var(--muted); font: 10px/1.4 var(--mono); }

    .map-shell {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--pattern) 1px, transparent 1px),
        linear-gradient(90deg, var(--pattern) 1px, transparent 1px);
      background-size: 16px 16px;
      -webkit-user-select: none;
      user-select: none;
    }
    .toolbar {
      position: absolute;
      z-index: 4;
      top: 8px;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border: 2px solid var(--chrome-line);
      border-radius: var(--chrome-radius);
      background: color-mix(in srgb, var(--paper) 92%, transparent);
    }
    .toolbar input[type="search"] {
      width: 176px;
      height: 28px;
      margin: 0;
      padding: 0 10px;
      border: 2px solid var(--chrome-line);
      border-radius: var(--chrome-radius);
      outline: none;
      background: var(--paper);
      font: 13px/1 var(--mono);
    }
    .toolbar input[type="search"]:focus { border-color: var(--ink); }
    .toolbar button {
      min-width: 30px;
      height: 28px;
      padding-inline: 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font: 12px/1 var(--mono);
      letter-spacing: 0;
      text-transform: none;
      transition: border-color 140ms ease-out, color 140ms ease-out, background-color 140ms ease-out, opacity 140ms ease-out;
    }
    .toolbar button:hover, .toolbar button:focus-visible { border-color: var(--ink); color: var(--ink); outline: 1px solid var(--ink); outline-offset: 1px; }
    .toolbar button[aria-expanded="false"] { color: var(--soft); background: var(--wash-6); }
    .toolbar button:disabled { cursor: not-allowed; opacity: .38; }
    .toolbar-separator { width: 1px; margin: 4px 2px; background: var(--rule); }
    #map-svg { width: 100%; height: 100%; display: block; touch-action: none; -webkit-user-select: none; user-select: none; }
    .map-bg { fill: transparent; }

    #arrow-muted path { fill: var(--connector); }
    #arrow-ink path { fill: var(--ink); }
    #arrow-link path { fill: var(--link); }
    #arrow-accent path { fill: var(--accent); }
    #arrow-soft path { fill: var(--connector-dim); }
    #arrow-imports path { fill: var(--edge-imports); }
    #arrow-calls path { fill: var(--edge-calls); }
    #arrow-reads path { fill: var(--edge-reads); }
    #arrow-writes path { fill: var(--edge-writes); }
    #arrow-publishes path { fill: var(--edge-publishes); }
    #arrow-subscribes path { fill: var(--edge-subscribes); }
    #arrow-unknown path { fill: var(--edge-unknown); }

    .zone, .zone-mask, .zone-label { display: none; }

    [data-edge-type="imports"] { --edge-color: var(--edge-imports); }
    [data-edge-type="calls"] { --edge-color: var(--edge-calls); }
    [data-edge-type="reads"] { --edge-color: var(--edge-reads); }
    [data-edge-type="writes"] { --edge-color: var(--edge-writes); }
    [data-edge-type="publishes"] { --edge-color: var(--edge-publishes); }
    [data-edge-type="subscribes"] { --edge-color: var(--edge-subscribes); }
    .edge {
      fill: none;
      stroke: var(--edge-paint, var(--edge-color, var(--connector)));
      stroke-width: 1.75;
      marker-end: url(#arrow-muted);
      pointer-events: stroke;
      cursor: crosshair;
      transition: stroke-width 180ms var(--ease-in), opacity 180ms var(--ease-in);
    }
    .edge-blend-from,
    .edge-blend-to {
      stop-color: var(--edge-color, var(--connector));
      transition: stop-color 180ms var(--ease-in);
    }
    .edge-blend-mid {
      stop-color: var(--edge-color, var(--connector));
    }
    .edge-bundle.blend .edge-blend-from {
      stop-color: var(--from-card);
      transition: stop-color 240ms var(--ease-out);
    }
    .edge-bundle.blend .edge-blend-to {
      stop-color: var(--to-card);
      transition: stop-color 240ms var(--ease-out);
    }
    .edge-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 48;
      vector-effect: non-scaling-stroke;
      pointer-events: stroke;
      cursor: crosshair;
    }
    .edge-march {
      fill: none;
      stroke: color-mix(in srgb, var(--edge-color, var(--connector)) 55%, #ffffff);
      stroke-width: 3.25;
      stroke-dasharray: 11 9;
      stroke-linecap: round;
      pointer-events: none;
      opacity: 0;
      transition: opacity 180ms var(--ease-in);
    }
    .edge-march.on,
    .edge-hit:hover + .edge + .edge-march {
      opacity: 1;
      transition: opacity 240ms var(--ease-out);
      animation: edge-flow 640ms linear infinite;
    }
    @keyframes edge-flow {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -20; }
    }
    .edge[data-edge-type="imports"] { marker-end: url(#arrow-imports); }
    .edge[data-edge-type="calls"] { marker-end: url(#arrow-calls); }
    .edge[data-edge-type="reads"] { marker-end: url(#arrow-reads); }
    .edge[data-edge-type="writes"] { marker-end: url(#arrow-writes); }
    .edge[data-edge-type="publishes"] { marker-end: url(#arrow-publishes); }
    .edge[data-edge-type="subscribes"] { marker-end: url(#arrow-subscribes); }
    .edge.unknown { --edge-color: var(--edge-unknown); stroke-width: 1.75; stroke-dasharray: 5 4; marker-end: url(#arrow-unknown); }
    .edge.hot {
      stroke-width: 2.75;
      opacity: 1;
      transition: stroke-width 240ms var(--ease-out), opacity 240ms var(--ease-out);
    }
    .edge.flow {
      --edge-color: var(--accent);
      stroke-width: 2.75;
      marker-end: url(#arrow-accent);
      transition: stroke-width 240ms var(--ease-out), opacity 240ms var(--ease-out);
    }
    .edge.dim { stroke-width: 1.25; opacity: .12; }
    .edge-mask { fill: var(--paper); pointer-events: none; }
    .edge-label { fill: var(--edge-color, var(--connector)); font: 600 11px var(--mono); letter-spacing: 0; pointer-events: none; }

    @media (hover: hover) and (pointer: fine) {
      .edge:hover, .edge-hit:hover + .edge {
        stroke-width: 3;
        opacity: 1;
      }
    }

    .node {
      cursor: grab;
      outline: none;
      --fill: var(--group-color);
      transition: opacity 140ms ease-out;
    }
    .node:active { cursor: grabbing; }
    .node.hot, .node.flow, .node.match { opacity: 1; }
    .node.focus { opacity: 1; }
    .node .card-visual { transform-box: fill-box; transform-origin: center; }
    .node .card-shadow, .node .card-head, .node .card-rule, .node .group-rail, .node .tag { display: none; }
    .node .box { fill: var(--fill); stroke: none; }
    .node .card-lip { fill: url(#card-lip); pointer-events: none; }
    .node .card-scrim { pointer-events: none; }
    .node .wash-a,
    .node .wash-b,
    .node .wash-c {
      transition: stop-color 180ms var(--ease-out), stop-opacity 180ms var(--ease-out);
    }
    .node .wash-a {
      stop-color: color-mix(in srgb, var(--group-color) 58%, #111111);
      stop-opacity: .16;
    }
    .node .wash-b {
      stop-color: color-mix(in srgb, var(--group-color) 36%, #0a0a0a);
      stop-opacity: .4;
    }
    .node .wash-c {
      stop-color: color-mix(in srgb, var(--group-color) 20%, #050505);
      stop-opacity: .76;
    }
    .node.focus .wash-a {
      stop-color: color-mix(in srgb, var(--group-color) 20%, #050505);
      stop-opacity: .76;
    }
    .node.focus .wash-c {
      stop-color: color-mix(in srgb, var(--group-color) 58%, #111111);
      stop-opacity: .16;
    }
    .node .tag-text { fill: rgba(255, 255, 255, .86); font: 600 11px var(--mono); letter-spacing: .06em; }
    .node .boundary-stamp,
    .node .node-title,
    .node .node-path { dominant-baseline: hanging; }
    .node .boundary-stamp { fill: rgba(255, 255, 255, .82); font: 13px/1.15 var(--sans); letter-spacing: 0; }
    .node .node-title { fill: #ffffff; font: 600 20px/1.15 var(--sans); letter-spacing: 0; }
    .node .node-path { fill: rgba(255, 255, 255, .88); font: 15px/1.2 var(--sans); }
    .node.dim { opacity: .14; }

    .empty { color: var(--muted); }
    .detail-title { margin: 0 0 2px; font: 600 16px/1.25 var(--mono); letter-spacing: 0; overflow-wrap: anywhere; }
    .detail-path { margin: 0 0 12px; color: var(--muted); font: 11px/1.4 var(--mono); overflow-wrap: anywhere; }
    .detail-block { margin: 0 0 12px; }
    .detail-block h3 { margin: 0 0 4px; color: var(--soft); font: 10px var(--mono); letter-spacing: 0; text-transform: none; }
    .detail-block p { margin: 0; overflow-wrap: anywhere; }
    .detail-block ul { margin: 0; padding-left: 16px; }
    .detail-block li { overflow-wrap: anywhere; }
    .detail-block code, .detail-block li { font-family: var(--mono); }
    .detail-boundary { color: var(--group-color); }
    .test-list { padding: 8px; border: 1px solid var(--rule-solid); background: var(--paper); }
    .detail-action {
      width: 100%;
      min-height: 32px;
      margin: 0 0 12px;
      border: 1px solid var(--ink);
      border-radius: 0;
      color: var(--ink);
      background: var(--accent-tint);
      cursor: pointer;
      font: 600 11px var(--mono);
      letter-spacing: 0;
      text-transform: none;
      transition: background-color 140ms ease-out;
    }
    .detail-action:hover, .detail-action:focus-visible { background: var(--paper); outline: 1px solid var(--ink); outline-offset: 1px; }
    .badge {
      display: inline-block;
      margin-top: 4px;
      padding: 0 4px;
      border: 1px solid var(--rule-solid);
      color: var(--soft);
      font: 10px/16px var(--mono);
      letter-spacing: 0;
      text-transform: none;
    }
    .status-line {
      position: absolute;
      right: 8px;
      left: auto;
      bottom: 8px;
      max-width: min(420px, calc(100% - 16px));
      padding: 6px 10px;
      border: 2px solid var(--chrome-line);
      border-radius: var(--chrome-radius);
      color: var(--ink);
      background: color-mix(in srgb, var(--paper) 92%, transparent);
      font: 12px/1.4 var(--mono);
      letter-spacing: 0;
      pointer-events: none;
    }

    @media (max-width: 900px) {
      main { --left-column: 200px; grid-template-columns: var(--left-column) minmax(0, 1fr); }
      .right { display: none; }
      .right:not(:has(> .empty)) {
        display: block;
        position: fixed;
        z-index: 8;
        top: 8px;
        right: 8px;
        bottom: 8px;
        width: min(280px, calc(100vw - 216px));
        border: 1px solid var(--rule-solid);
      }
      .map-head { max-width: min(240px, calc(100% - 200px)); }
    }
    @media (max-width: 600px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      main {
        height: auto;
        min-height: 100vh;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 100vh auto;
      }
      .map-shell { grid-row: 1; min-height: 520px; }
      .left { grid-row: 2; border-top: 1px solid var(--rule); border-right: 0; }
      .right:not(:has(> .empty)) { top: auto; left: 8px; width: auto; max-height: 65vh; }
      main[data-left-collapsed="true"] .left,
      main[data-right-collapsed="true"] .right {
        padding-inline: 12px;
        border-color: var(--rule);
        opacity: 1;
        overflow: auto;
        visibility: visible;
        pointer-events: auto;
      }
      #toggle-left, #toggle-right { display: none; }
      .toolbar-separator { display: none; }
      .toolbar { right: 8px; max-width: calc(100% - 16px); }
      .map-head { max-width: calc(100% - 16px); }
      .card-legend { max-width: calc(100% - 16px); }
    }

    .explore-bar { position: absolute; z-index: 6; top: 76px; left: 20px; right: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; pointer-events: none; }
    .breadcrumbs, .view-actions, .pagination { display: flex; gap: 4px; align-items: center; pointer-events: auto; border: 2px solid var(--chrome-line); background: var(--paper-2); border-radius: 12px; padding: 4px; }
    .navigation-controls { display: flex; align-items: center; gap: 6px; max-width: 56%; min-width: 0; pointer-events: auto; }
    #back-view, #forward-view { flex: 0 0 auto; border: 2px solid var(--chrome-line); border-radius: 10px; padding: 10px; background: var(--paper-2); cursor: pointer; }
    #back-view:disabled, #forward-view:disabled { opacity: .35; cursor: default; }
    .node[data-group] { cursor: zoom-in; }
    .breadcrumbs { max-width: 100%; overflow: auto; scrollbar-width: none; }
    .breadcrumbs button, .view-actions button, .pagination button { border: 0; background: transparent; border-radius: 8px; padding: 7px 10px; white-space: nowrap; cursor: pointer; color: var(--muted); }
    .breadcrumbs button:last-child { color: var(--ink); background: var(--wash-6); }
    .breadcrumbs span { color: var(--soft); }
    button { transition: transform var(--motion-quick) var(--ease-out), background-color var(--motion-quick), color var(--motion-quick); }
    button:active:not(:disabled) { transform: scale(.97); }
    button:focus-visible, .node:focus-visible { outline: 2px solid #c6d9ff; outline-offset: 3px; }
    .view-actions button[aria-pressed="true"] { background: #24304b; color: #c6d9ff; }
    .view-actions button:hover, .breadcrumbs button:hover, .pagination button:hover { background: var(--wash-6); color: var(--ink); }
    .pagination { position: absolute; z-index: 6; bottom: 38px; left: 50%; transform: translateX(-50%); }
    .pagination span { padding: 0 10px; color: var(--muted); font: 11px var(--mono); }
    .pagination button:disabled { opacity: .25; cursor: default; }
    .coverage-pill { font: 11px var(--mono); }
    .coverage-pill[data-quality="partial"] { color: #f6c986; }
    .map-head { top: 14px; left: 14px; background: var(--paper); }
    .map-head h1 { font-family: var(--sans); font-size: 19px; letter-spacing: -.025em; }
    .toolbar { top: 17px; right: 16px; }
    .card-legend { left: 16px; bottom: 42px; max-height: 28vh; }

re.write_artifact(artifact, output / 'masters' / name, 1)\r\n        spec['assets'][name] = f'masters/{name}/pixel-art.json'\r\n        placement = {'asset': name, 'x': x, 'y': y, 'depth': depth, 'subject': part.get('role') != 'environment'}\r\n        if placement['subject']:\r\n            placement['group'] = name.split('-')[0]\r\n        spec['placements'].append(placement)\r\n    construct.save(output / 'scene-source.json', spec)\r\n    scene = compose_scene.compile_scene(spec, output)\r\n    compose_scene.write_scene(scene, output / 'view')\r\n    compose_scene.validate_output(output / 'view')\r\n    expected, _ = construct.compile_parts(source)\r\n    if compose_scene.scene_grid(scene) != expected['grid']:\r\n        raise ValueError('Scene export changed the constructed pixels')","start_line":16,"end_line":49,"extractor":"python-ast","source_digest":"8b6b748f06f4cd2e098918d0334883fdca1479522d030ad48fc6b05d0ef49451","kind":"definition"},{"path":"SKILLS/pixel-art-html/examples/part-construction/build_demo.py","symbol":"def lesson_gallery(output):\r\n    lessons = construct.read(ROOT / 'lessons.json')\r\n    output.mkdir(parents=True)\r\n    payload = json.dumps(lessons, ensure_ascii=False).replace('<', '\\\\u003c')\r\n    page = '''<!doctype html><html lang=\"en\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width\"><title>Original repair lessons<\/title>\r\n<style>body{background:#142128;color:#dbe0d5;font:16px/1.5 system-ui;margin:28px;max-width:1150px}select{font:inherit;background:#243842;color:inherit;padding:8px;max-width:100%}main{display:flex;gap:50px}figure{margin:16px 0}canvas{image-rendering:pixelated;background:#26333a;margin-right:20px}p{max-width:90ch}dt{font-weight:700;color:#e6c784}dd{margin:0 0 10px}small{color:#9cabb0}<\/style>\r\n<h1>Seven original failure / repair lessons<\/h1><p>Recorded local revisions from three studies. Includes a failed repair and a partial improvement. These are conditional lessons, not independent quality tests.<\/p><label for=\"lesson\">Failure to inspect<\/label> <select id=\"lesson\"><\/select><main><\/main><dl><\/dl><script id=\"lessons-data\" type=\"application/json\">PAYLOAD<\/script><script>\r\nconst data=JSON.parse(document.getElementById('lessons-data').textContent),pick=document.getElementById('lesson');data.lessons.forEach(l=>{let o=document.createElement('option');o.value=l.id;o.textContent=l.title;pick.append(o)});\r\nfunction draw(){let l=data.lessons.find(l=>l.id===pick.value);document.querySelector('main').replaceChildren();['before','after'].forEach(k=>{let f=document.createElement('figure');let title=document.createElement('h2');title.textContent=k==='before'?'Observed problem':'Revision';f.append(title);const a=l[k];[1,4].forEach(z=>{const c=document.createElement('canvas');c.width=a.width;c.height=a.height;c.style.width=a.width*z+'px';c.style.height=a.height*z+'px';c.dataset.side=k;c.dataset.zoom=z;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;a.grid.forEach((r,y)=>r.forEach((v,x)=>{if(v){ctx.fillStyle=v;ctx.fillRect(x,y,1,1)}}));f.append(c)});document.querySelector('main').append(f)});const dl=document.querySelector('dl');dl.replaceChildren();for(const k of ['observed','cause','intervention','preserve','limit','probe']){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=l[k];dl.append(dt,dd)}}pick.onchange=draw;draw();<\/script><\/html>'''\r\n    (output / 'index.html').write_text(page.replace('PAYLOAD', payload), encoding='utf-8')\r\n    from PIL import Image, ImageDraw, ImageColor\r\n    for lesson in lessons['lessons']:\r\n        a, b = lesson['before'], lesson['after']\r\n        board = Image.new('RGB', (max(520, (a['width'] + b['width']) * 4 + 70), max(a['height'], b['height']) * 4 + 72), '#142128')\r\n        d = ImageDraw.Draw(board)\r\n        d.text((12, 8), lesson['id'], fill='#dbe0d5')\r\n        for x, item, label in [(12, a, 'Observed'), (max(270, a['width']*4+40), b, 'Revision')]:\r\n            d.text((x, 28), label, fill='#e6c784')\r\n            image = Image.new('RGBA', (item['width'], item['height']))\r\n            image.putdata([((*ImageColor.getrgb(c), 255) if c else (0, 0, 0, 0)) for row in item['grid'] for c in row])\r\n            board.paste(image.resize((image.width * 4, image.height * 4), Image.Resampling.NEAREST), (x, 50))\r\n        board.save(output / (lesson['id'] + '.png'))","start_line":52,"end_line":73,"extractor":"python-ast","source_digest":"8b6b748f06f4cd2e098918d0334883fdca1479522d030ad48fc6b05d0ef49451","kind":"definition"},{"path":"SKILLS/pixel-art-html/examples/part-construction/build_demo.py","symbol":"def main():\r\n    parser = argparse.ArgumentParser(description=__doc__)\r\n    parser.add_argument('--output', type=Path, required=True)\r\n    args = parser.parse_args()\r\n    if args.output.exists():\r\n        parser.error('Output must be a new directory; preserve previous evidence')\r\n    args.output.mkdir(parents=True)\r\n    links = []\r\n    for name in ('lighthouse', 'tree', 'encounter'):\r\n        record = construct.read(ROOT / 'recordings' / (name + '.json'))\r\n        previous = None\r\n        for i, step in enumerate([*record['lineage'], {'source': record['source']}]):\r\n            source = step['source']\r\n            destination = args.output / name / source['stage']\r\n            review = record['lineage'][i-1]['review'] if i else None\r\n            construct.build(source, destination, previous, review)\r\n            previous = destination\r\n        links.append(f'<article><h2>{html.escape(record[\"source\"][\"title\"])}<\/h2><img src=\"{name}/material/pixel-art.png\"><p><a href=\"{name}/material/parts.html\">Inspect parts<\/a> · <a href=\"{name}/block/parts.html\">Block<\/a> · <a href=\"{name}/planes/parts.html\">Planes<\/a><\/p><\/article>')\r\n        if name == 'encounter':\r\n            camera(record['source'], args.output / 'encounter-scene')\r\n    l origin=[x0,y0]\n        if parent:\n            px,py=self.world_origins[parent];origin=[x0-px,y0-py]\n        p={'id':name,'origin':origin,'grid':rows,'anchors':{k:[p[0]-x0,p[1]-y0] for k,p in (anchors or {}).items()}}\n        if parent:p['parent']=parent\n        self.source['parts'].append(p);self.world_origins[name]=[x0,y0]\n        return p\n\n    def visible(self, name, minimum):\n        self.source['constraints'].append(dict(id=name+' remains visible',kind='visible',part=name,min_cells=minimum))\n\n    def attach(self, aid, a, b):\n        self.source['constraints'].append(dict(id=aid,kind='anchor',a=a,b=b,max_distance=0))","start_line":18,"end_line":44,"extractor":"python-ast","source_digest":"d512276b04788e1c4faf5e448ebf891b322abda86e7d0d07168821bdc117f720","kind":"definition"},{"path":"SKILLS/pixel-art-html/examples/part-construction/create_sources.py","symbol":"def lighthouse():\n    c=Drawing('El faro del espolón',(16,16),'A slender sea lighthouse rises from a broken rock shelf; the small lantern is its brightest cue',8)\n    c.shape('sea',[(0,12),(15,12),(15,15),(0,15)],'s')\n    c.shape('rock',[(2,15),(3,13),(6,12),(11,12),(14,15)],'d')\n    for p in c.source['parts']:p['role']='environment'\n    c.shape('tower',[(7,4),(9,4),(10,13),(6,13)],'m',anchors={'lantern-seat':[8,4]})\n    c.shape('lantern',[(7,3),(9,3),(9,4),(7,4)],'g',anchors={'base':[8,4]},parent='tower')\n    c.shape('cap',[(7,2),(8,1),(9,2)],'d',parent='tower')\n    c.shape('gallery',[(6,5),(10,5)],'d',parent='tower')\n    c.attach('lantern seats on tower',['tower','lantern-seat'],['lantern','base'])\n    c.visible('tower',16);c.visible('lantern',5)\n    return c","start_line":47,"end_line":58,"extractor":"python-ast","source_digest":"d512276b04788e1c4faf5e448ebf891b322abda86e7d0d07168821bdc117f720","kind":"definition"},{"path":"SKILLS/pixel-art-html/examples/part-construction/create_sources.py","symbol":"def tree():\n    c=Drawing('El árbol del viento',(32,32),'One wind-shaped crown lea lysis":"analyzed","is_test":false,"symbols":["artifact_image","authored_master","data_uri","distort","main","parse_csv_ints","parse_distortions","reconstruction_metrics","render_report","run_benchmark"],"evidence":{"status":"verified","locations":[{"path":"SKILLS/pixel-art-html/scripts/benchmark_small_grids.py","symbol":"def authored_master(size: int) -> Any:\n    from PIL import Image\n\n    image = Image.new(\"RGBA\", (size, size), (0, 0, 0, 0))\n    pixels = image.load()\n    mask: set[tuple[int, int]] = set()\n    for y in range(size):\n        ny = (y + 0.5) / size\n        for x in range(size):\n            nx = (x + 0.5) / size\n            if 0.18 <= ny < 0.34 and abs(nx - 0.5) <= 0.12:\n                mask.add((x, y))\n            elif 0.31 <= ny <= 0.86:\n                half_width = 0.16 + 0.16 * math.sin(min(1.0, (ny - 0.31) / 0.55) * math.pi * 0.82)\n                if abs(nx - 0.5) <= half_width:\n                    mask.add((x, y))\n    for x, y in mask:\n        edge = any((x + dx, y + dy) not in mask for dx, dy in ((-1, 0), (1, 0), (0, -1), (0, 1)))\n        if y < round(size * 0.31):\n            color = (210, 132, 58, 255)\n        elif edge:\n            color = (24, 28, 38, 255)\n        else:\n            color = (190, 36, 54, 255)\n        pixels[x, y] = color\n    accent_x = max(0, min(size - 1, round(size * 0.43)))\n    accent_y = max(0, min(size - 1, round(size * 0.47)))\n    if (accent_x, accent_y) in mask:\n        pixels[accent_x, accent_y] = (255, 218, 120, 255)\n    return image","start_line":22,"end_line":51,"extractor":"python-ast","source_digest":"be1aab393c845f6eeba2b4f0c73185388fd75b01bef99975c0b15cdd2cf8a0e0","kind":"definition"},{"path":"SKILLS/pixel-art-html/scripts/benchmark_small_grids.py","symbol":"def distort(image: Any, kind: str, seed: int) -> Any:\n    from PIL import Image, ImageFilter\n\n    if kind == \"nearest\":\n        return image.resize((image.width * 6, image.height * 6), Image.Resampling.NEAREST)\n    if kin \n    \"\"\"Return bounded polarity and the reason; unknown constructions stay uncertain.\"\"\"\n    t = normalize(raw)\n    if re.search(r'\\b(tutorial (dice|explica|muestra)|tutorial says|example says|segun el tutorial)\\b', t):\n        return 'uncertain', 'reported-source-not-current-observation'\n    if re.search(r'\\b(no solo|not only|no es que|it is not that)\\b', t):\n        return 'uncertain', 'unsupported-scope'\n    if (re.search(r'[?¿]|[“”«»\"]', raw) or re.search(r\"'[^']+'\", raw) or\n        re.search(r'\\b(quizas|quiza|tal vez|maybe|perhaps|podria|might|creo|no se si|not sure|dudo)\\b|^\\s*(si|if)\\b', t)):\n        return 'uncertain', 'question-quote-or-uncertainty'\n    if re.search(r'\\b(antes|previously|used to|anteriormente|historicamente)\\b', t):\n        return 'uncertain', 'historical-not-current'\n    if re.search(r'\\b(no (quiero|queremos|debes|debe|agregar|agregues|quitar|quites|eliminar|elimines|cambiar|cambies)|do not (add|remove|change)|don.t (add|remove|change)|preservar|conservar|mantener|preserve|keep)\\b', t):\n        return 'preserve', 'intent-not-defect'\n    if re.search(r'\\b(quiero|queremos|busco|want to|would like to)\\s+(quitar|eliminar|corregir|reducir|remove|fix|reduce)\\b', t):\n        return 'uncertain', 'requested-operation-not-observation'\n    if re.search(r'\\b(quiero|queremos|busco|me gusta|no me molesta|want to|would like|intentional noise)\\b', t):\n        return 'preserve', 'desired-style-not-defect'\n    if re.search(r'\\b(no (esta[n]? |se ha[n]? |se )?(corregid[oa]s?|resuelt[oa]s?|solucionad[oa]s?|corrigio|resolvio)|not (yet )?(fixed|resolved)|sin (corregir|resolver)|without (fixing|resolving)|no desaparec[ei]o)\\b', t):\n        return 'uncertain', 'negated-resolution-requires-observation'\n    if re.search(r'\\b(falta|necesita mas|needs more|too little|not intentional)\\b', t):\n        return 'uncertain', 'missing-or-intent-scope'\n    if re.search(r'\\b(ya no|no longer|corregid[oa]s?|resuelt[oa]s?|solucionad[oa]s?|already fixed|resolved)\\b', t):\n        return 'ruled_out', 'resolved-or-no-longer'\n    if len(re.findall(r'\\b(no|not|never|nunca)\\b', t)) > 1:\n        return 'uncertain', 'multiple-negations'\n    # \"No ownership problem\" is absence; \"ownership cannot be read\" is a defect.\n    if re.search(r'\\b(no (hay|tiene|presenta|existe) (un |ningun )?(problema|error)|no problem|without (a )?problem)\\b', t):\n        return 'ruled_out', 'explicit-absence'\n    if re.search(r'\\b(no se entiende|no encaja[n]?|no es cenital|not overhead|cannot read|can.t read|not readable|do not fit|does not fit|no describe[n]?|sin separacion de valores|espejado sin relight)\\b', t):\n        return 'observed', 'negative-capability-is-a-defect'\n    if re.search(r'\\b(no|not|sin|without|neither|nor|ni|never|nunca)\\b|\\b(?:doesn.t|isn.t|don.t)\\b', t):\n        if len(issues_in(raw)) > 1 and not re.search(r'\\b(ni|nor|neither)\\b', t):\n            return 'uncertain', 'ambiguous-negation-scope'\n        return 'ruled_out', 'simple-negation'\n    return 'observed', 'affirmative-candidate'","start_line":99,"end_line":134,"extractor":"python-ast","source_digest":"3f9cd8d585cdfc26794f27a20c17c29696079f755cd06fd060c0951444f111ac","kind":"definition"}]},"callers":[],"callees":[{"id":"external:python:__future__","type":"imports","type_only":false},{"id":"external:python:re","type":"calls","type_only":false},{"id":"external:python:re","type":"imports","type_only":false},{"id":"external:python:typing","type":"imports","type_only":false},{"id":"external:python:unicodedata","type":"calls","type_only":false},{"id":"external:python:unicodedata","type":"imports","type_only":false}],"parent":"SKILLS/pixel-art-html/scripts"},{"id":"SKILLS/pixel-art-html/scripts/pixel_lab.py","path":"SKILLS/pixel-art-html/scripts/pixel_lab.py","label":"pixel_lab.py","type":"module","boundary":"Repository","entrypoints":[],"tests":[],"test_evidence":[],"analysis":"analyzed","is_test":false,"symbols":["apply :\n        attrs = dict(attrs)\n        if tag == \"img\":\n            self.image = attrs.get(\"src\", \"\")\n        if tag == \"figcaption\":\n            self.caption = True\n\n    def handle_endtag(self, tag):\n        if tag == \"figcaption\":\n            self.caption = False\n\n    def handle_data(self, data):\n        self.parts.append(data)\n        if self.caption and self.image:\n            self.images[self.image] = self.images.get(self.image, \"\") + data","start_line":31,"end_line":53,"extractor":"python-ast","source_digest":"7ebde8c6cf241c3766f3a06189afd6a20e61f9e0ce7237e603982139be333948","kind":"definition"},{"path":"SKILLS/pixel-art-html/scripts/reference_library.py","symbol":"def probe_video(path: Path) -> dict:\n    if not shutil.which(\"ffprobe\"):\n        return {\"video_probe\": \"unavailable: ffprobe is not installed\"}\n    result = subprocess.run(\n        [\"ffprobe\", \"-v\", \"error\", \"-select_streams\", \"v:0\", \"-show_entries\",\n         \"stream=width,height,nb_frames:format=duration\", \"-of\", \"json\", str(path)],\n        check=True, capture_output=True, timeout=30,\n    )\n    value = json.loads(result.stdout)\n    stream = value.get(\"streams\", [{}])[0]\n    return {\"width\": stream.get(\"width\"), \"height\": stream.get(\"height\"),\n            \"frames\": stream.get(\"nb_frames\"), \"duration_seconds\": float(value[\"format\"][\"duration\"]),\n            \"video_probe\": \"metadata-only\"}","start_line":56,"end_line":68,"extractor":"python-ast","source_digest":"7ebde8c6cf241c3766f3a06189afd6a20e61f9e0ce7237e603982139be333948","kind":"definition"}]},"callers":[],"callees":[{"id":"external:python:PIL","type":"imports","type_only":false},{"id":"external:python:__future__","type":"imports","type_only":false},{"id":"external:python:argparse","type":"calls","type_only":false},{"id":"external:python:argparse","type":"imports","type_only":false},{"id":"external:python:collections","type":"calls","type_only":false},{"id":"ext art-html/scripts/test_build_pixel_art.py","symbol":"def requires_pillow(test_method):\n    test_method.requires_pillow = True\n    return test_method","start_line":25,"end_line":27,"extractor":"python-ast","source_digest":"095c5d514cc55a825c0b6f51002e81a7d3e4072951b0e228801e51146d1a370d","kind":"definition"},{"path":"SKILLS/pixel-art-html/scripts/test_build_pixel_art.py","symbol":"class PixelArtBuilderTests(unittest.TestCase):\n    def test_large_rectangular_master_exports_native_and_preserves_edge_cells(self):\n        artifact = module.compile_spec({\n            'width': 512, 'height': 256, 'evidence_tier': 'fixture',\n            'pixels': [{'x': 0, 'y': 0, 'color': '#123456'},\n                       {'x': 511, 'y': 255, 'color': '#ABCDEF'}],\n        })\n        with tempfile.TemporaryDirectory() as temp:\n            output = Path(temp)\n            module.write_artifact(artifact, output, None)\n            self.assertEqual(module.validate_png_parity(artifact, output / 'pixel-art.png'), 1)\n            self.assertEqual(module.validate_output(output)['grid'][255][511], '#ABCDEF')\n            self.assertIsNone(artifact['grid'][255][510])\n            with self.assertRaisesRegex(module.ArtifactError, 'smaller --scale'):\n                module.write_png(artifact, output / 'too-large.png', 16)\n        with self.assertRaisesRegex(module.ArtifactError, 'between 8 and 512'):\n            module.compile_spec({'width': 513, 'height': 256})\n        source = {'kind': 'construction', 'schema_version': 1, 'stage': 'block',\n                  'title': 'Large part fixture', 'intent': 'Boundary checks only',\n                  'light': 'Upper left', 'width': 256, 'height': 512,\n                  'palette_budget': 1, 'background': None, 'palette': {'x': '#123456'},\n                  'parts': [{'id': 'edge', 'origin': [255, 0], 'grid': ['x'] * 512}],\n                  'constraints': []}\n        part_artifact, _ = construct.compile_parts(source)\n        self.assertEqual(part_artifact['grid'][511][255], '#123456')\n\n    def test_compile_spec_and_write_standalone_artifact(self) -> None:\n        spec = {\n            \"title\": \"Test beacon\",\n            \"width\": 8,\n            \"height\": 8,\n            \"palette\": {\"ink\": \"#123\", \"light\": \"#ffd166\"},\n            \"rects\": [{\"x\": 3, \"y\": 1, \"width\": 2, \"height\": 6, \"color\": \"ink\"}],\n            \"runs\": [{\"x\": 2, \"y\": 7, \"length\": 4, \"color\": \"ink\"}],\n            \"pixels\": [{\"x\": 3, \"y\": 2, \"color\": \"light\"}],\n        }\n        artifact = module.compile_spec(spec)\n        self.assertEqual((artifact[\"width\"], artifact[\"height\"]), (8, 8))\n        self.assertEqual(artifact[\"evidence_tier\"], \"draft\")\n        self.assertEqual(artifact[\"grid\"][2][3], \"#FFD166\")\n        self.assertEqual(set(artifact[\"palette\"]), {\"#112233\", \"#FFD166\"})\n        with tempfile.TemporaryDirectory() as temp:\n            output = Path(temp)\n            module.write_artifact(artifact, output, 4)\n            verified = module.validate_output(output)\n            self.assertEqual(verified[\"title\"], \"Test beacon\")\n            self.assertNotIn(\"https://\", (output / \"index.html\").read_text(encoding=\"utf-8\"))\n            self.assertEqual((output / \"pixel-art.png\").read_bytes()[:8], b\"\\x89PNG\\r\\n\\x1a\\n\")\n            self.assertIn(\"native-scale-proof\", (output / \"index.html\").read_text(encoding=\"utf-8\"))\n\n    def test_evidence_tier_is_explicit_and_rejects_false_labels(self) -> None:\n        fixture = module.compile_spec({\n            \"title\": \"Timing fixture\",\n            \"width\": 8,\n            \"height\": 8,\n            \"evidence_tier\": \"fixture\",\n            \"background\": \"#123\",\n        })\n        self.assertEqual(fixture[\"evidence_tier\"], \"fixture\")\n        with tempfile.TemporaryDirectory() as temp:\n            output = Path(temp)\n            module.write_artifact(fixture, output, 4)\n            proof = (output / \"index.html\").read_text(encoding=\"utf-8\")\n            self.assertIn(\"Fixture / mechanics only\", proof)\n            self.assertIn(\"evidence_tier\", proof)\n        with self.assertRaisesRegex(module.ArtifactError, \"evidence_tier must be one of\"):\n            module.compile_spec({\"width\": 8, \"height\": 8, \"evidence_tier\": \"production\", \"background\": \"#123\"})\n        for promoted_tier in (\"representative\", \"production-candidate\"):\n            with self.subTest(promoted_tier=promoted_tier):\n                with self.assertRaisesRegex(module.ArtifactError, \"authoring evidence_tier\"):\n                    module.compile_spec({\n                        \"width\": 8,\n                        \"height\": 8,\n                        \"evidence_tier\": promoted_tier,\n                        \"background\": \"#123\",\n                    })\n\n    def test_motifs_support_reuse_flips_and_palette_maps(self) -> None:\n        artifact = module.compile_spec({\n            \"width\": 8,\n            \"height\": 8,\n            \"palette\": {\"a\": \"#123\", \"b\": \"#456\", \"c\": \"#abc\"},\n            \"motifs\": {\"leaf\": [\". a .\", \"a a a\", \". b .\"]},\n            \"stamps\": [\n                {\"motif\": \"leaf\", \"x\": 0, \"y\": 1},\n                {\"motif\": \"leaf\", \"x\": 4, \"y\": 1, \"flip_x\": True, \"map\": {\"a\": \"c\"}},\n            ],\n        })\n        self.assertEqual(artifact[\"grid\"][1][1], \"#112233\")\n        self.assertEqual(artifact[\"grid\"][3][1], \"#445566\")\n        self.assertEqual(artifact[\"grid\"][1][5], \"#AABBCC\")\n        self.assertEqual(artifact[\"quality\"][\"clusters\"], 4)\n\n    def test_one_column_motif_accepts_a_semantic_palette_alias(self) -> None:\n        artifact = module.compile_spec({\n            \"width\": 8,\n            \"height\": 8,\n            \"palette\": {\"grass\": \"#385A3A\"},\n            \"motifs\": {\"stem\": [\"grass\", \"grass\", \".\"]},\n            \"stamps\": [{\"motif\": \"stem\", \"x\": 2, \"y\": 1}],\n        })\n        self.assertEqual(artifact[\"grid\"][1][2], \"#385A3A\")\n        self.assertEqual(artifact[\"grid\"][2][2], \"#385A3A\")\n        self.assertIsNone(artifact[\"grid\"][3][2])\n\n    def test_full_grid_accepts_compact_one_character_alias_rows(self) -> None:\n        artifact = module.compile_spec({\n            \"width\": 8,\n            \"height\": 8,\n            \"palette\": {\"i\": \"#112233\", \"l\": \"#FFD166\"},\n            \"grid\": [\n                \"........\",\n                \"...ii...\",\n                \"..ill...\",\n                \"..iiii..\",\n                \"..iiii..\",\n                \"...ii...\",\n                \"...ii...\",\n                \"........\",\n            ],\n        })\n        self.assertEqual(artifact[\"grid\"][2][2:5], [\"#112233\", \"#FFD166\", \"#FFD166\"])\n        self.assertIsNone(artifact[\"grid\"][0][0])\n\n    def test_quality_report_surfaces_orphan_pixel_risk_without_scoring_art(self) -> None:\n        artifact = module.compile_spec({\n            \"width\": 8,\n            \"height\": 8,\n            \"palette\": {\"ink\": \"#202020\", \"near\": \"#242424\"},\n            \"pixels\": [\n                {\"x\": 0, \"y\": 0, \"color\": \"ink\"},\n                {\"x\": 2, \"y\": 2, \"color\": \"ink\"},\n                {\"x\": 4, \"y\": 4, \"color\": \"near\"},\n                {\"x\": 6, \"y\": 6, \"color\": \"near\"},\n            ],\n        })\n        report = artifact[\"quality\"]\n        self.assertEqual(report[\"single_pixel_clusters\"], 4)\n        self.assertTrue(any(\"orphan-pixel\" in warning for warning in report[\"warnings\"]))\n        self.assertTrue(any(\"value span\" in warning for warning in report[\"warnings\"]))\n        self.assertNotIn(\"score\", report)\n\n    def test_image_cluster_cleanup_merges_opt_in_singletons_without_eroding_alpha(self) -> None:\n        grid = [\n            [None, \"#111111\", \"#111111\"],\n            [None, \"#FF0000\", \"#111111\"],\n            [None, \"#111111\", \"#111111\"],\n        ]\n        cleaned = module.merge_small_color_clusters(grid, 2)\n        self.assertIsNone(cleaned[1][0])\n        self.assertEqual(cleaned[1][1], \"#111111\")\n        self.assertEqual(module.merge_small_color_clusters(grid, 1), grid)\n\n    def test_rejects_out_of_bounds_operations(self) -> None:\n        with self.assertRaisesRegex(module.ArtifactError, \"out of bounds\"):\n            module.compile_spec({\"width\": 8, \"height\": 8, \"pixels\": [{\"x\": 8, \"y\": 0, \"color\": \"#fff\"}]})\n\n    def test_rejects_malformed_motifs(self) -> None:\n        with self.assertRaisesRegex(module.ArtifactError, \"equal width\"):\n            module.compile_spec({\"width\": 8, \"height\": 8, \"motifs\": {\"bad\": [\"x x\", \"x\"]}})\n        with self.assertRaisesRegex(module.ArtifactError, \"strings or null\"):\n            module.compile_spec({\"width\": 8, \"height\": 8, \"motifs\": {\"bad\": [[{\"color\": \"#fff\"}]]}})\n\n    def test_rejects_palette_drift(self) -> None:\n        artifact = module.compile_spec({\"width\": 8, \"height\": 8, \"pixels\": [{\"x\": 0, \"y\": 0, \"color\": \"#fff\"}]})\n        artifact[\"palette\"] = []\n        with self.assertRaisesRegex(module.ArtifactError, \"palette does not match\"):\n            module.validate_artifact(artifact)\n\n    def test_rejects_empty_art(self) -> None:\n        artifact = module.compile_spec({\"width\": 8, \"height\": 8})\n        with self.assertRaisesRegex(module.ArtifactError, \"no painted pixels\"):\n            module.validate_artifact(artifact)\n\n    def test_parse_recommended_size_set(self) -> None:\n        self.assertEqual(module.parse_sizes(\"all\"), [16, 24, 32, 40, 48, 64])\n        self.assertEqual(module.parse_sizes(\"16, 32,64\"), [16, 32, 64])\n        with self.assertRaisesRegex(module.ArtifactError, \"duplicates\"):\n            module.parse_sizes(\"16,16\")\n\n    def test_write_and_validate_collection(self) -> None:\n        first = module.compile_spec({\"title\": \"Small\", \"width\": 8, \"height\": 8, \"background\": \"#123\"})\n        second = module.compile_spec({\"title\": \"Large\", \"width\": 12, \"height\": 12, \"background\": \"#456\"})\n        with tempfile.TemporaryDirectory() as temp:\n            output = Path(temp)\n            module.write_collection([first, second], output, 4, \"Resolution set\")\n            manifest = module.validate_output(output)\n            self.assertEqual(manifest[\"kind\"], \"collection\")\n            self.assertEqual([item[\"path\"] for item in manifest[\"items\"]], [\"8x8\", \"12x12\"])\n            self.assertTrue((output / \"8x8\" / \"pixel-art.png\").is_file())\n            self.assertNotIn(\"https://\", (output / \"index.html\").read_text(encoding=\"utf-8\"))\n            critique = module.critique_output(output)\n            self.assertEqual([item[\"path\"] for item in critique[\"items\"]], [\"8x8\", \"12x12\"])\n\n    def test_write_and_validate_same_size_asset_pack(self) -> None:\n        first = module.compile_spec({\"title\": \"Copper key\", \"width\": 8, \"height\": 8, \"background\": \"#123\"})\n        second = module.compile_spec({\"title\": \"Moon key\", \"width\": 8, \"height\": 8, \"background\": \"#456\"})\n        with tempfile.TemporaryDirectory() as temp:\n            output = Path(temp)\n            module.write_collection([first, second], output, 4, \"Key set\", kind=\"pack\")\n            manifest = module.validate_output(output)\n            self.assertEqual(manifest[\"kind\"], \"pack\")\n            self.assertEqual([item[\"path\"] for item in manifest[\"items\"]], [\"copper-key\", \"moon-key\"])\n            self.assertTrue((output / \"copper-key\" / \"pixel-art.png\").is_file())\n            self.assertEqual(module.critique_output(output)[\"kind\"], \"pack\")\n            self.assertEqual(module.result_summary(manifest, output)[\"evidence_tiers\"], [\"draft\", \"draft\"])\n\n    def test_direction_study_writes_three_exact_children_and_an_anonymous_blind_board(self) -> None:\n        artifacts = []\n        for index, x in enumerate((2, 3, 4), start=1):\n            artifacts.append(module.compile_spec({\n                \"title\": f\"Named direction {index}\",\n                \"width\": 8,\n                \"height\": 8,\n                \"evidence_tier\": \"draft\",\n                \"art_direction\": {\"thesis\": f\"materially different thesis {index}\"},\n                \"palette\": {\"i\": \"#123\"},\n                \"pixels\": [{\"x\": x, \"y\": 3, \"color\": \"i\"}],\n            }))\n        with tempfile.TemporaryDirectory() as temp:\n            output = Path(temp) / \"study\"\n            manifest = module.write_study(artifacts, output, 8, \"Direction study\")\n            verified = module.validate_output(output)\n            self.assertEqual(manifest, verified)\n            self.assertEqual(manifest[\"kind\"], \"study\")\n            self.assertEqual([item[\"path\"] for item in manifest[\"items\"]], [\"sample-a\", \"sample-b\", \"sample-c\"])\n            self.assertTrue(all((output / item[\"path\"] / \"pixel-art.json\").is_file() for item in manifest[\"items\"]))\n            blind = (output / \"blind.html\").read_text(encoding=\"utf-8\")\n            self.assertIn(\"Sample A\", blind)\n            self.assertIn(\"Native 1x\", blind)\n            self.assertNotIn(\"Named direction\", blind)\n            self.assertNotIn(\"materially different thesis\", blind)\n            self.assertNotIn(\"evidence_tier\", blind)\n            self.assertNotIn(\"source\", blind)\n            self.assertNotIn(\"https://\", blind)\n\n    def test_direction_study_rejects_duplicate_or_incomparable_candidates(self) -> None:\n        first = module.compile_spec({\"title\": \"A\", \"width\": 8, \"height\": 8, \"background\": \"#123\"})\n        duplicate = module.compile_spec({\"title\": \"B\", \"width\": 8, \"height\": 8, \"background\": \"#123\"})\n        different_size = module.compile_spec({\"title\": \"C\", \"width\": 12, \"height\": 12, \"background\": \"#123\"})\n        topology = module.compile_spec({\n            \"title\": \"Topology A\",\n            \"width\": 8,\n            \"height\": 8,\n            \"palette\": {\"a\": \"#112233\", \"b\": \"#445566\"},\n            \"pixels\": [{\"x\": 2, \"y\": 2, \"color\": \"a\"}, {\"x\": 3, \"y\": 2, \"color\": \"b\"}],\n        })\n        palette_swap = module.compile_spec({\n            \"title\": \"Topology B\",\n            \"width\": 8,\n            \"height\": 8,\n            \"palette\": {\"a\": \"#AA2233\", \"b\": \"#44BB66\"},\n            \"pixels\": [{\"x\": 2, \"y\": 2, \"color\": \"b\"}, {\"x\": 3, \"y\": 2, \"color\": \"a\"}],\n        })\n        other_shape = module.compile_spec({\n            \"title\": \"Topology C\",\n            \"width\": 8,\n            \"height\": 8,\n            \"palette\": {\"a\": \"#112233\"},\n            \"pixels\": [{\"x\": 4, \"y\": 4, \"color\": \"a\"}],\n        })\n        with tempfile.TemporaryDirectory() as temp:\n            output = Path(temp) / \"study\"\n            with self.assertRaisesRegex(module.ArtifactError, \"materially different grids\"):\n                module.write_study([first, duplicate, first], output, 4, \"Duplicates\")\n            with self.assertRaisesRegex(module.ArtifactError, \"palette-only variants\"):\n                module.write_study([topology, palette_swap, other_shape], output, 4, \"Palette swap\")\n            with self.assertRaisesRegex(module.ArtifactError, \"same exact grid dimensions\"):\n                module.write_study([first, different_size, module.compile_spec({\n                    \"title\": \"D\",\n                    \"width\": 8,\n                    \"height\": 8,\n                    \"palette\": {\"i\": \"#456\"},\n                    \"pixels\": [{\"x\": 1, \"y\": 1, \"color\": \"i\"}],\n                })], output, 4, \"Mixed dimensions\")\n\n    def test_promotion_requires_a_blind_non_builder_review_tied_to_the_grid(self) -> None:\n        artifact = module.compile_spec({\n            \"title\": \"Review candidate\",\n            \"width\": 8,\n            \"height\": 8,\n            \"palette\": {\"i\": \"#123\", \"l\": \"#EEE\"},\n            \"rects\": [{\"x\": 2, \"y\": 2, \"width\": 4, \"height\": 4, \"color\": \"i\"}],\n            \"pixels\": [{\"x\": 3, \"y\": 2, \"color\": \"l\"}],\n        })\n        review = {\n            \"reviewer\": {\"kind\": \"user\", \"name\": \"Blind fixture reviewer\"},\n            \"blind\": True,\n            \"decision\": \"accept\",\n            \"observations\": {\n                \"subject\": \"compact beacon\",\n                \"orientation_action\": \"upright\",\n                \"material\": \"dark housing and pale lamp\",\n                \"focal_cue\": \"pale top cell\",\n                \"signature\": \"offset lamp\",\n                \"mismatch\": \"none\",\n            },\n            \"gates\": {\n                \"blind_read\": \"passed\",\n                \"native_silhouette\": \"passed\",\n                \"value_hierarchy\": \"passed\",\n                \"material_read\": \"passed\",\n                \"focal_read\": \"passed\",\n                \"browser_proof\": \"passed\",\n            },\n        }\n        with tempfile.TemporaryDirectory() as temp:\n            output = Path(temp) / \"candidate\"\n            module.write_artifact(artifact, output, 4)\n            self_review = {**review, \"reviewer\": {\"kind\": \"self\", \"name\": \"Builder\"}}\n            with self.assertRaisesRegex(module.ArtifactError, \"non-builder reviewer\"):\n                module.promote_output(output, self_review, \"representative\")\n            promoted = module.promote_output(output, review, \"representative\")\n            self.assertEqual(promoted[\"evidence_tier\"], \"representative\")\n            verified = module.validate_output(output)\n            self.assertEqual(verified[\"evidence_tier\"], \"representative\")\n            record_path = output / \"visual-review.json\"\n            record = json.loads(record_path.read_text(encoding=\"utf-8\"))\n            self.assertEqual(record[\"artifact_fingerprints\"], {\"pixel-art.json\": module.artifact_fingerprint(verified)})\n            record[\"artifact_fingerprints\"][\"pixel-art.json\"] = \"0\" * 64\n            record_path.write_text(json.dumps(record), encoding=\"utf-8\")\n            with self.assertRaisesRegex(module.ArtifactError, \"review fingerprint\"):\n                module.validate_output(output)\n\n    def test_production_candidate_promotion_requires_owner_review(self) -> None:\n        artifact = module.compile_spec({\"title\": \"Candidate\", \"width\": 8, \"height\": 8, \"background\": \"#123\"})\n        review = {\n            \"reviewer\": {\"kind\": \"user\", \"name\": \"Reviewer\"},\n            \"blind\": True,\n            \"decision\": \"accept\",\n            \"observations\": {\n                \"subject\": \"square\",\n                \"orientation_action\": \"front\",\n                \"material\": \"flat\",\n                \"focal_cue\": \"center\",\n                \"signature\": \"none\",\n                \"mismatch\": \"none\",\n            },\n            \"gates\": {\n                \"blind_read\": \"passed\",\n                \"native_silhouette\": \"passed\",\n                \"value_hierarchy\": \"passed\",\n                \"material_read\": \"passed\",\n                \"focal_read\": \"passed\",\n                \"browser_proof\": \"passed\",\n            },\n        }\n        with tempfile.TemporaryDirectory() as temp:\n            output = Path(temp) / \"candidate\"\n            module.write_artifact(artifact, output, 4)\n            with self.assertRaisesRegex(module.ArtifactError, \"owner reviewer\"):\n                module.promote_output(output, review, \"production-candidate\")\n\n    def test_pack_promotion_requires_item_reads_and_binds_every_grid(self) -> None:\n        first = module.compile_spec({\"title\": \"Copper key\", \"width\": 8, \"height\": 8, \"background\": \"#123\"})\n        second = module.compile_spec({\"title\": \"Moon key\", \"width\": 8, \"height\": 8, \"background\": \"#456\"})\n        review = {\n            \"reviewer\": {\"kind\": \"user\", \"name\": \"Blind set reviewer\"},\n            \"blind\": True,\n            \"decision\": \"accept\",\n            \"observations\": {\n                \"subject\": \"two distinct key tokens\",\n                \"orientation_action\": \"upright\",\n                \"material\": \"copper and pale metal\",\n                \"focal_cue\": \"contrasting key heads\",\n                \"signature\": \"different head cuts\",\n                \"mismatch\": \"none\",\n                \"items\": {\n                    \"copper-key\": \"warm square-headed key\",\n                    \"moon-key\": \"pale round-headed key\",\n                },\n            },\n            \"gates\": {\n                \"blind_read\": \"passed\",\n                \"native_silhouette\": \"passed\",\n                \"value_hierarchy\": \"passed\",\n                \"material_read\": \"passed\",\n                \"focal_read\": \"passed\",\n                \"browser_proof\": \"passed\",\n                \"set_context\": \"passed\",\n            },\n        }\n        with tempfile.TemporaryDirectory() as temp:\n            output = Path(temp) / \"pack\"\n            module.write_collection([first, second], output, 4, \"Key set\", kind=\"pack\")\n            missing_item = json.loads(json.dumps(review))\n            del missing_item[\"observations\"][\"items\"][\"moon-key\"]\n            with self.assertRaisesRegex(module.ArtifactError, \"every item path\"):\n                module.promote_output(output, missing_item, \"representative\")\n            self.assertEqual(module.validate_output(output)[\"kind\"], \"pack\")\n            promoted = module.promote_output(output, review, \"representative\")\n            self.assertEqual(promoted[\"kind\"], \"pack\")\n            self.assertEqual(module.result_summary(promoted, output)[\"evidence_tiers\"], [\"representative\", \"representative\"])\n            record = json.loads((output / \"visual-review.json\").read_text(encoding=\"utf-8\"))\n            self.assertEqual(\n                set(record[\"artifact_fingerprints\"]),\n                {\"copper-key/pixel-art.json\", \"moon-key/pixel-art.json\"},\n            )\n            self.assertTrue((output / \"copper-key\" / \"visual-review.json\").is_file())\n\n    def test_direction_study_cannot_be_promoted_or_hide_a_tampered_grid(self) -> None:\n        artifacts = [\n            module.compile_spec({\n                \"title\": f\"Direction {index}\",\n                \"width\": 8,\n                \"height\": 8,\n                \"palette\": {\"i\": color},\n                \"pixels\": [{\"x\": index, \"y\": 2, \"color\": \"i\"}],\n            })\n            for index, color in enumerate((\"#112233\", \"#445566\", \"#778899\"), start=1)\n        ]\n        with tempfile.TemporaryDirectory() as temp:\n            output = Path(temp) / \"study\"\n            module.write_study(artifacts, output, 4, \"Study\")\n            review = {\n                \"reviewer\": {\"kind\": \"user\", \"name\": \"Reviewer\"},\n                \"blind\": True,\n                \"decision\": \"accept\",\n                \"observations\": {\n                    \"subject\": \"three marks\",\n                    \"orientation_action\": \"static\",\n                    \"material\": \"flat\",\n                    \"focal_cue\": \"single cell\",\n                    \"signature\": \"position\",\n                    \"mismatch\": \"none\",\n                },\n                \"gates\": {field: \"passed\" for field in module.REVIEW_GATE_FIELDS},\n            }\n            with self.assertRaisesRegex(module.ArtifactError, \"direction study cannot be promoted\"):\n                module.promote_output(output, review, \"representative\")\n            blind_path = output / \"blind.html\"\n            blind_path.write_text(blind_path.read_text(encoding=\"utf-8\").replace(\"#112233\", \"#FFFFFF\"), encoding=\"utf-8\")\n            with self.assertRaisesRegex(module.ArtifactError, \"blind study payload\"):\n                module.validate_output(output)\n\n    def test_study_build_and_promote_commands_cover_the_public_workflow(self) -> None:\n        review = {\n            \"reviewer\": {\"kind\": \"user\", \"name\": \"CLI fixture reviewer\"},\n            \"blind\": True,\n            \"decision\": \"accept\",\n            \"observations\": {\n                \"subject\": \"small beacon\",\n                \"orientation_action\": \"upright\",\n                \"material\": \"dark housing\",\n                \"focal_cue\": \"light cell\",\n                \"signature\": \"offset light\",\n                \"mismatch\": \"none\",\n            },\n            \"gates\": {field: \"passed\" for field in module.REVIEW_GATE_FIELDS},\n        }\n        with tempfile.TemporaryDirectory() as temp:\n            root = Path(temp)\n            specs = []\n            for index, color in enumerate((\"#112233\", \"#445566\", \"#778899\"), start=1):\n                path = root / f\"{index}.json\"\n                path.write_text(json.dumps({\n                    \"title\": f\"Direction {index}\",\n                    \"width\": 8,\n                    \"height\": 8,\n                    \"palette\": {\"i\": color},\n                    \"pixels\": [{\"x\": index, \"y\": 2, \"color\": \"i\"}],\n                }), encoding=\"utf-8\")\n                specs.append(path)\n            study_output = root / \"study\"\n            study_run = subprocess.run(\n                [sys.executable, str(MODULE_PATH), \"study\", *(str(path) for path in specs), \"--output\", str(study_output)],\n                capture_output=True,\n                text=True,\n                check=False,\n            )\n            self.assertEqual(study_run.returncode, 0, study_run.stderr)\n            self.assertEqual(json.loads(study_run.stdout)[\"kind\"], \"study\")\n            final_output = root / \"final\"\n            build_run = subprocess.run(\n                [sys.executable, str(MODULE_PATH), \"from-spec\", str(specs[0]), \"--output\", str(final_output)],\n                capture_output=True,\n                text=True,\n                check=False,\n            )\n            self.assertEqual(build_run.returncode, 0, build_run.stderr)\n            review_path = root / \"review.json\"\n            review_path.write_text(json.dumps(review), encoding=\"utf-8\")\n            promote_run = subprocess.run(\n                [sys.executable, str(MODULE_PATH), \"promote\", str(final_output), str(review_path), \"--tier\", \"representative\"],\n                capture_output=True,\n                text=True,\n                check=False,\n            )\n            self.assertEqual(promote_run.returncode, 0, promote_run.stderr)\n            self.assertEqual(json.loads(promote_run.stdout)[\"evidence_tier\"], \"representative\")\n            self.assertEqual(module.validate_output(final_output)[\"evidence_tier\"], \"representative\")\n\n    def test_proof_template_keeps_art_visible_and_hides_context_in_blind_mode(self) -> None:\n        template = module.TEMPLATE_PATH.read_text(encoding=\"utf-8\")\n        self.assertIn(\"position: sticky\", template)\n        self.assertIn(\"body.blind-review\", template)\n        self.assertIn(\"document.body.classList.toggle('blind-review', blind)\", template)\n        self.assertIn(\"data-blind-sensitive\", template)\n\n    def test_validation_rejects_png_pixels_that_drift_from_grid(self) -> None:\n        artifact = module.compile_spec({\"width\": 8, \"height\": 8, \"background\": \"#123\"})\n        drifted = module.compile_spec({\"width\": 8, \"height\": 8, \"background\": \"#456\"})\n        with tempfile.TemporaryDirectory() as temp:\n            output = Path(temp)\n            module.write_artifact(artifact, output, 4)\n            module.write_png(drifted, output / \"pixel-art.png\", 4)\n            with self.assertRaisesRegex(module.ArtifactError, \"pixels do not match\"):\n                module.validate_output(output)\n\n    def test_validation_rejects_a_second_compressed_png_stream(self) -> None:\n        artifact = module.compile_spec({\"width\": 8, \"height\": 8, \"background\": \"#123\"})\n        with tempfile.TemporaryDirectory() as temp:\n            output = Path(temp)\n            module.write_artifact(artifact, output, 1)\n            png_path = output / \"pixel-art.png\"\n            payload = png_path.read_bytes()\n            position = 8\n            rebuilt = bytearray(payload[:8])\n            while position < len(payload):\n                length = module.struct.unpack(\">I\", payload[position:position + 4])[0]\n                kind = payload[position + 4:position + 8]\n                chunk = payload[position + 8:position + 8 + length]\n                if kind == b\"IDAT\":\n                    chunk += module.zlib.compress(b\"unexpected second stream\")\n                rebuilt.extend(module.png_chunk(kind, chunk))\n                position += 12 + length\n            png_path.write_bytes(bytes(rebuilt))\n            with self.assertRaisesRegex(module.ArtifactError, \"extra compressed stream\"):\n                module.validate_output(output)\n\n    def test_tile_artifacts_include_automatic_repeat_proof(self) -> None:\n        artifact = module.compile_spec({\n            \"title\": \"Grass tile\",\n            \"width\": 8,\n            \"height\": 8,\n            \"art_direction\": {\"use\": \"top-down tile\"},\n            \"background\": \"#385A3A\",\n        })\n        non_tile = module.compile_spec({\"width\": 8, \"height\": 8, \"art_direction\": {\"use\": \"item\"}, \"background\": \"#385A3A\"})\n        self.assertTrue(artifact[\"proofs\"][\"repeat_3x\"])\n        self.assertFalse(non_tile[\"proofs\"][\"repeat_3x\"])\n        with tempfile.TemporaryDirectory() as temp:\n            output = Path(temp)\n            module.write_artifact(artifact, output, 4)\n            embedded = module.read_embedded_json(output / \"index.html\", \"pixel-art-data\")\n            self.assertTrue(embedded[\"proofs\"][\"repeat_3x\"])\n\n    def test_validation_rejects_stale_single_and_pack_html(self) -> None:\n        first = module.compile_spec({\"title\": \"First\", \"width\": 8, \"height\": 8, \"background\": \"#123\"})\n        second = module.compile_spec({\"title\": \"Second\", \"width\": 8, \"height\": 8, \"background\": \"#456\"})\n        replacement = module.compile_spec({\"title\": \"Replacement\", \"width\": 8, \"height\": 8, \"background\": \"#789\"})\n        with tempfile.TemporaryDirectory() as temp:\n            output = Path(temp)\n            module.write_collection([first, second], output, 4, \"Pair\", kind=\"pack\")\n            module.write_artifact(replacement, output / \"first\", 4)\n            with self.assertRaisesRegex(module.ArtifactError, \"manifest item does not match child\"):\n                module.validate_output(output)\n            module.write_artifact(first, output / \"first\", 4)\n            (output / \"first\" / \"pixel-art.json\").write_text(json.dumps(replacement), encoding=\"utf-8\")\n            with self.assertRaisesRegex(module.ArtifactError, \"HTML embedded artifact does not match\"):\n                module.validate_output(output / \"first\")\n\n    def test_slugify_preserves_international_title_identity(self) -> None:\n        self.assertEqual(module.slugify(\"Poción mágica\"), \"pocion-magica\")\n        self.assertEqual(module.slugify(\"生命水晶\"), \"生命水晶\")\n        self.assertEqual(module.slugify(\"CON\"), \"pixel-con\")\n\n    @requires_pillow\n    def test_image_route_when_pillow_i tifact(repaired)\n\n    @requires_pillow\n    def test_small_grid_benchmark_cli_writes_machine_and_browser_reports(self) -> None:\n        try:\n            import PIL  # noqa: F401\n        except ImportError:\n            self.skipTest(\"Pillow not installed\")\n        benchmark_script = MODULE_PATH.with_name(\"benchmark_small_grids.py\")\n        with tempfile.TemporaryDirectory() as temp:\n            output = Path(temp) / \"benchmark\"\n            completed = subprocess.run(\n                [sys.executable, str(benchmark_script), \"--output\", str(output), \"--sizes\", \"8\", \"--distortions\", \"nearest,fractional\"],\n                capture_output=True,\n                text=True,\n                check=False,\n            )\n            self.assertEqual(completed.returncode, 0, completed.stderr)\n            summary = json.loads(completed.stdout.strip())\n            self.assertEqual(summary[\"sizes\"], [8])\n            self.assertEqual(summary[\"distortions\"], [\"nearest\", \"fractional\"])\n            self.assertEqual(summary[\"methods\"], [\"legacy\", \"two-stage\"])\n            report = json.loads((output / \"benchmark.json\").read_text(encoding=\"utf-8\"))\n            self.assertEqual(len(report[\"samples\"]), 4)\n            self.assertEqual({sample[\"target_size\"] for sample in report[\"samples\"]}, {8})\n            html = (output / \"index.html\").read_text(encoding=\"utf-8\")\n            self.assertIn(\"Small-grid reconstruction benchmark\", html)\n            self.assertIn(\"data:image/png;base64,\", html)\n            self.assertNotIn(\"https://\", html)\n\n    @requires_pillow\n    def test_optional_pixel_fixer_adapter_records_external_detection_without_path_leak(self) -> None:\n        try:\n            from PIL import Image\n        except ImportError:\n            self.skipTest(\"Pillow not installed\")\n        with tempfile.TemporaryDirectory() as temp:\n            root = Path(temp)\n            source = root / \"source.png\"\n
