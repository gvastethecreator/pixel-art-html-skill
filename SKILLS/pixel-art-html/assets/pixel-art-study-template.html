<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>Blind pixel-art study</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-monospace, "Cascadia Mono", monospace;
      --paper: #090b09;
      --raised: #111510;
      --ink: #f2efe6;
      --muted: #9ca198;
      --line: #3b4139;
      --stage: #020302;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); }
    main { width: min(1120px, calc(100% - 28px)); margin: auto; padding: 28px 0 44px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 18px; }
    h1 { margin: 0; font: 760 clamp(28px, 5vw, 52px)/.95 system-ui, sans-serif; letter-spacing: -.05em; }
    header p { max-width: 42ch; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 2px solid var(--line); background: var(--line); gap: 2px; }
    article { min-width: 0; padding: 16px; background: var(--raised); }
    h2 { margin: 0 0 14px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
    .stage { min-height: 330px; display: grid; place-items: center; padding: 24px; overflow: auto; background: var(--stage); }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    .proof { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px; margin-top: 14px; color: var(--muted); font-size: 11px; }
    .native-shell { min-height: 42px; display: flex; align-items: center; padding: 8px; border: 1px solid var(--line); background: var(--stage); }
    @media (width <= 48rem) {
      header { align-items: start; flex-direction: column; }
      .board { grid-template-columns: 1fr; }
      .stage { min-height: 250px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Blind direction study</h1>
      <p>Compare recognition, silhouette, value, material, focal cue, and one memorable signature. Judge the three samples before opening their named drafts.</p>
    </header>
    <section class="board" id="board" aria-label="Three anonymous pixel-art directions"></section>
  </main>
  <script id="study-data" type="application/json">__STUDY_JSON__</script>
  <script>
    const data = JSON.parse(document.querySelector('#study-data').textContent);
    const board = document.querySelector('#board');
    const paint = (canvas, item, scale) => {
      canvas.width = item.width * scale;
      canvas.height = item.height * scale;
      const context = canvas.getContext('2d', { alpha:true });
      context.imageSmoothingEnabled = false;
      item.grid.forEach((row, y) => row.forEach((color, x) => {
        if (color) {
          context.fillStyle = color;
          context.fillRect(x * scale, y * scale, scale, scale);
        }
      }));
    };
    data.items.forEach(item => {
      const card = document.createElement('article');
      const heading = document.createElement('h2');
      heading.textContent = item.label;
      const stage = document.createElement('div');
      stage.className = 'stage';
      const large = document.createElement('canvas');
      large.setAttribute('aria-label', `${item.label} enlarged proof`);
      paint(large, item, Math.max(4, Math.min(16, Math.floor(240 / Math.max(item.width, item.height)))));
      stage.appendChild(large);
      const proof = document.createElement('div');
      proof.className = 'proof';
      const label = document.createElement('span');
      label.textContent = 'Native 1x';
      const shell = document.createElement('span');
      shell.className = 'native-shell';
      const native = document.createElement('canvas');
      native.setAttribute('aria-label', `${item.label} native proof`);
      paint(native, item, 1);
      shell.appendChild(native);
      proof.append(label, shell);
      card.append(heading, stage, proof);
      board.appendChild(card);
    });
    window.__PIXEL_ART_STUDY_READY__ = true;
  </script>
</body>
</html>
