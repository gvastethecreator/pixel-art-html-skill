<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE_TEXT__</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#eeeeee;background:#111111}*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}button{font:inherit;color:inherit;background:#1a1a1a;border:1px solid #404040;border-radius:5px;min-height:38px;padding:7px 12px;cursor:pointer}button:hover{background:#2a2a2a;border-color:#888888}button:focus-visible,canvas:focus-visible{outline:2px solid #efbc74;outline-offset:3px}button:disabled{opacity:.4;cursor:default}header{padding:22px 28px 18px;border-bottom:1px solid #333333;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.eyebrow{color:#cf9b63;letter-spacing:.15em;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:6px}h1{font-family:Georgia,serif;font-weight:400;font-size:30px;letter-spacing:-.02em;margin:0}#subtitle{font-size:12px;color:#9e9e9e;margin:6px 0 0}.groups{display:flex;gap:8px;flex-wrap:wrap}.groups button{display:flex;align-items:center;gap:9px;font-size:12px}.groups button[aria-pressed=false]{opacity:.45}.dot{width:7px;height:7px;border-radius:1px;background:var(--swatch)}main{position:relative;min-height:0;padding:18px 24px 0}#viewport{width:100%;height:100%;display:block;background:#111111;touch-action:none;cursor:grab;border:1px solid #363636;border-radius:7px;image-rendering:pixelated}#viewport.dragging{cursor:grabbing}.scene-note{position:absolute;left:42px;top:34px;padding:7px 10px;border:1px solid #3f3f3f;background:#111111e8;pointer-events:none;font-size:10px;letter-spacing:.1em;color:#a4a4a4;text-transform:uppercase}.landmarks{position:absolute;left:42px;bottom:18px;display:flex;gap:6px}.landmarks button{font-size:11px;background:#1a1a1aeb;min-height:32px}.tools{display:flex;gap:6px;align-items:center}.tools button{min-width:38px}.tools output{font-variant-numeric:tabular-nums;min-width:52px;text-align:center;font-size:12px;color:#eed3a8}footer{padding:16px 26px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.help{color:#949494;font-size:11px;line-height:1.7}.help b{color:#c5c5c5;font-weight:500}.divider{width:1px;height:24px;background:#3e3e3e;margin:0 5px}#status{color:#949494;font-size:10px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:760px){header{padding:14px 18px;gap:10px}h1{font-size:24px}main{padding:10px 12px 0}.scene-note{left:24px;top:24px}.landmarks{left:24px;bottom:12px}footer{padding:10px 14px}.help{display:none}.groups button{padding:5px 8px}}
select{font:inherit;font-size:11px;color:#d0d0d0;background:#1a1a1a;border:1px solid #404040;border-radius:5px;min-height:38px;padding:6px}select:focus-visible{outline:2px solid #efbc74;outline-offset:3px}
</style></head>
<body><header><div><div class="eyebrow">Pixel art · escena original</div><h1 id="title">__TITLE_TEXT__</h1><p id="subtitle"></p></div><div class="groups" id="groups" role="group" aria-label="Mostrar facciones"></div></header>
<main aria-label="Escena interactiva"><canvas id="viewport" tabindex="0" aria-label="Escena. Arrastra para desplazar. Usa la rueda o más y menos para acercar. Flechas para mover. Inicio para encuadrar." aria-describedby="camera-help"></canvas><div class="scene-note"></div><nav class="landmarks" id="landmarks" aria-label="Lugares de la escena"></nav></main>
<footer><div class="help" id="camera-help"><b>Arrastra</b> para explorar · <b>Rueda</b> para acercar<br><b>Flechas</b> para mover · <b>Inicio</b> para encuadrar <span id="status"></span></div><div class="tools" role="group" aria-label="Cámara"><select id="proof-mode" aria-label="Vista del dibujo"><option value="color">Color</option><option value="value">Valores</option><option value="actors">Actores en silueta</option></select><button id="fit">Encuadrar</button><button id="native" aria-label="Ver a escala nativa">1:1</button><span class="divider"></span><button id="minus" aria-label="Alejar">−</button><output id="zoom" aria-live="polite">100%</output><button id="plus" aria-label="Acercar">+</button></div></footer>
<script id="scene-data" type="application/json">__SCENE_JSON__</script>
<script>
'use strict';
const scene=JSON.parse(document.querySelector('#scene-data').textContent);
const canvas=document.querySelector('#viewport'),ctx=canvas.getContext('2d');
const world=document.createElement('canvas');world.width=scene.width;world.height=scene.height;
const pixels=world.getContext('2d'),hidden=new Set(),camera={x:0,y:0,zoom:1};
let width=0,height=0,dpr=1,drag=null,wheelAmount=0,insetX=0,insetY=0;
document.querySelector('#subtitle').textContent=scene.subtitle;
document.querySelector('.scene-note').textContent=scene.caption;
document.querySelector('#status').textContent=` · ${scene.width} × ${scene.height}`;
const sprites=new Map(Object.entries(scene.assets).map(([id,a])=>{const c=document.createElement('canvas');c.width=a.width;c.height=a.height;const g=c.getContext('2d');g.imageSmoothingEnabled=false;a.grid.forEach((row,y)=>row.forEach((color,x)=>{if(color){g.fillStyle=color;g.fillRect(x,y,1,1)}}));return[id,c]}));
function paintWorld(){const mode=document.querySelector('#proof-mode').value;pixels.clearRect(0,0,world.width,world.height);pixels.imageSmoothingEnabled=false;if(scene.background){pixels.fillStyle=scene.background;pixels.fillRect(0,0,world.width,world.height)}[...scene.placements].sort((a,b)=>a.depth-b.depth).forEach(p=>{if(hidden.has(p.group))return;let sprite=sprites.get(p.asset);if(mode!=='color'){const temp=document.createElement('canvas');temp.width=sprite.width;temp.height=sprite.height;const t=temp.getContext('2d');t.drawImage(sprite,0,0);const image=t.getImageData(0,0,temp.width,temp.height);for(let i=0;i<image.data.length;i+=4){let value=Math.round(image.data[i]*.2126+image.data[i+1]*.7152+image.data[i+2]*.0722);if(mode==='actors')value=p.subject?224:Math.round(value*.45);image.data[i]=image.data[i+1]=image.data[i+2]=value}t.putImageData(image,0,0);sprite=temp}pixels.save();if(p.flip_x){pixels.translate(p.x+sprite.width,p.y);pixels.scale(-1,1);pixels.drawImage(sprite,0,0)}else pixels.drawImage(sprite,p.x,p.y);pixels.restore()});draw()}
function bound(){const w=world.width*camera.zoom,h=world.height*camera.zoom;const reach=48;camera.x=Math.round(Math.min(width-reach,Math.max(reach-w,camera.x)));camera.y=Math.round(Math.min(height-reach,Math.max(reach-h,camera.y)))}
// Camera coordinates and zoom use canvas backing pixels derived from devicePixelRatio.
function draw(){if(!width)return;bound();ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,width,height);ctx.fillStyle='#111111';ctx.fillRect(0,0,width,height);ctx.drawImage(world,camera.x,camera.y,world.width*camera.zoom,world.height*camera.zoom);document.querySelector('#zoom').textContent=`${camera.zoom}×`;document.querySelector('#minus').disabled=camera.zoom===1;document.querySelector('#plus').disabled=camera.zoom===8;canvas.dataset.zoom=camera.zoom;canvas.dataset.panX=camera.x;canvas.dataset.panY=camera.y}
function zoomTo(value,x=width/2,y=height/2){value=Math.max(1,Math.min(8,Math.round(value)));const wx=(x-camera.x)/camera.zoom,wy=(y-camera.y)/camera.zoom;camera.zoom=value;camera.x=x-wx*value;camera.y=y-wy*value;draw()}
function fit(){camera.zoom=Math.max(1,Math.min(8,Math.floor(Math.min((width-48)/world.width,(height-64)/world.height))));camera.x=(width-world.width*camera.zoom)/2;camera.y=(height-world.height*camera.zoom)/2;draw()}
function resize(){const oldW=width,oldH=height,r=canvas.getBoundingClientRect(),style=getComputedStyle(canvas);dpr=window.devicePixelRatio||1;insetX=parseFloat(style.borderLeftWidth);insetY=parseFloat(style.borderTopWidth);canvas.width=Math.round((r.width-insetX-parseFloat(style.borderRightWidth))*dpr);canvas.height=Math.round((r.height-insetY-parseFloat(style.borderBottomWidth))*dpr);width=canvas.width;height=canvas.height;if(!oldW)fit();else{camera.x+=(width-oldW)/2;camera.y+=(height-oldH)/2;draw()}}
document.querySelector('#plus').onclick=()=>zoomTo(camera.zoom+1);
document.querySelector('#minus').onclick=()=>zoomTo(camera.zoom-1);
document.querySelector('#native').onclick=()=>zoomTo(1);
document.querySelector('#fit').onclick=fit;
document.querySelector('#proof-mode').onchange=paintWorld;
canvas.addEventListener('wheel',event=>{event.preventDefault();wheelAmount+=event.deltaY*(event.deltaMode===1?16:event.deltaMode===2?canvas.clientHeight:1);if(Math.abs(wheelAmount)<40)return;const r=canvas.getBoundingClientRect();zoomTo(camera.zoom+(wheelAmount<0?1:-1),(event.clientX-r.left-insetX)*dpr,(event.clientY-r.top-insetY)*dpr);wheelAmount=0},{passive:false});
canvas.addEventListener('pointerdown',event=>{if(event.button!==0||drag)return;canvas.focus({preventScroll:true});drag={id:event.pointerId,x:event.clientX,y:event.clientY,cx:camera.x,cy:camera.y};canvas.setPointerCapture(event.pointerId);canvas.classList.add('dragging')});
canvas.addEventListener('pointermove',event=>{if(!drag||event.pointerId!==drag.id)return;camera.x=drag.cx+(event.clientX-drag.x)*dpr;camera.y=drag.cy+(event.clientY-drag.y)*dpr;draw()});
function release(event){if(!drag||event.pointerId!==drag.id)return;drag=null;canvas.classList.remove('dragging')}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
canvas.addEventListener('keydown',event=>{if(event.key==='+'||event.key==='=')zoomTo(camera.zoom+1);else if(event.key==='-')zoomTo(camera.zoom-1);else if(event.key==='Home')fit();else if(event.key==='ArrowLeft')camera.x+=40;else if(event.key==='ArrowRight')camera.x-=40;else if(event.key==='ArrowUp')camera.y+=40;else if(event.key==='ArrowDown')camera.y-=40;else return;event.preventDefault();draw()});
for(const g of scene.groups){const b=document.createElement('button');b.setAttribute('aria-pressed','true');const dot=document.createElement('span');dot.className='dot';dot.style.setProperty('--swatch',g.color||'#eed3a8');const text=document.createElement('span');text.textContent=g.label;b.append(dot,text);b.onclick=()=>{if(hidden.has(g.id))hidden.delete(g.id);else hidden.add(g.id);b.setAttribute('aria-pressed',String(!hidden.has(g.id)));paintWorld()};document.querySelector('#groups').append(b)}
for(const p of scene.focus_points){const b=document.createElement('button');b.textContent=p.label;b.onclick=()=>{camera.zoom=p.zoom||4;camera.x=width/2-p.x*camera.zoom;camera.y=height/2-p.y*camera.zoom;draw()};document.querySelector('#landmarks').append(b)}
paintWorld();resize();new ResizeObserver(resize).observe(canvas);window.addEventListener('resize',resize);
</script></body></html>
