<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>__TITLE_TEXT__</title>
  <style>
    :root { color-scheme: dark; font-family: Bahnschrift, "Arial Narrow", "Helvetica Neue", sans-serif; --base:#080907; --surface:#11130f; --surface-2:#181a16; --ink:#f2efe6; --muted:#aaa69b; --line:rgba(102,108,97,.34); --edge:rgba(78,84,74,.30); --edge-strong:rgba(96,102,91,.42); --signal:#4a4f49; --signal-text:#92988f; --button:#0d0f0c; --button-hover:#1a1d18; --button-text:#aeb3ac; --focus:#90968e; --noise:url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 160 160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C%2Ffilter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.06'%2F%3E%3C%2Fsvg%3E"); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background-color: var(--base); background-image: var(--noise), radial-gradient(var(--line) .7px, transparent .7px); background-size: 160px 160px, 14px 14px; }
    a:focus-visible, canvas:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    main { width: min(1320px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 48px; }
    header { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 24px; margin-bottom: 24px; }
    .kicker { margin: 0 0 8px; color: var(--signal-text); font: 800 12px/1 ui-monospace, "Cascadia Mono", monospace; letter-spacing: .13em; text-transform: uppercase; }
    h1 { max-width: 20ch; margin: 0; font-size: clamp(34px, 6vw, 72px); font-weight: 780; line-height: .92; letter-spacing: -.055em; overflow-wrap: anywhere; text-wrap: balance; }
    .set-stamp { min-width: 170px; max-width: 100%; padding: 11px 13px; border: 2px solid var(--edge-strong); background: var(--surface); box-shadow: 4px 4px 0 #000; font: 700 12px/1.4 ui-monospace, "Cascadia Mono", monospace; overflow-wrap: anywhere; }
    .set-stamp strong { display: block; font-size: 20px; }
    .grid { display: flex; flex-wrap: wrap; justify-content: center; align-items: stretch; gap: 14px; }
    article { width: 100%; max-width: calc((100% - 28px) / 3); min-width: 0; flex: 0 1 calc((100% - 28px) / 3); display: grid; grid-template-rows: auto minmax(320px, 1fr) auto; border: 2px solid var(--edge-strong); background: var(--surface); box-shadow: 6px 6px 0 #000; }
    .card-head, .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 13px; font: 750 12px/1.25 ui-monospace, "Cascadia Mono", monospace; }
    .card-head { border-bottom: 2px solid var(--edge); }
    .size { color: var(--signal-text); font-size: 15px; }
    .stage { min-width: 0; display: grid; place-items: center; padding: 24px; overflow: auto; background-color: #020302; background-image: linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px); background-size: 20px 20px; }
    .proof { padding: 10px; border: 2px solid var(--edge-strong); background-color: #20231d; background-image: linear-gradient(45deg,#171914 25%,transparent 25%),linear-gradient(-45deg,#171914 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#171914 75%),linear-gradient(-45deg,transparent 75%,#171914 75%); background-size: 16px 16px; background-position: 0 0,0 8px,8px -8px,-8px 0; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    .card-foot { align-items: stretch; flex-direction: column; border-top: 2px solid var(--edge); }
    .tape { display: flex; height: 10px; overflow: hidden; border: 1px solid var(--edge-strong); }
    .tape span { min-width: 2px; }
    .facts { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); }
    .open { display: block; padding: 10px 12px; border: 2px solid var(--edge-strong); color: var(--button-text); background: var(--button); text-align: center; text-decoration: none; font: 780 13px/1 Bahnschrift, sans-serif; }
    .open:hover { border-color: var(--signal); color: #c8ccc6; background: var(--button-hover); }
    .set-stamp, article, .card-head, .card-foot, .open { background-image: var(--noise); background-size: 160px 160px; }
    @media (width <= 60rem) { article { max-width: calc((100% - 14px) / 2); flex-basis: calc((100% - 14px) / 2); } }
    @media (width <= 42rem) { main { width: calc(100% - 20px); padding-top: 18px; } header { grid-template-columns: 1fr; } h1 { font-size: clamp(36px,13vw,58px); } .set-stamp { width: fit-content; } article { max-width: 100%; flex-basis: 100%; grid-template-rows:auto minmax(300px,55vh) auto; } }
  </style>
</head>
<body>
  <main>
    <header><div><p class="kicker" id="collection-kicker">Pixel proof / artifact set</p><h1 id="title"></h1></div><div class="set-stamp"><strong id="count"></strong><span id="range"></span></div></header>
    <section class="grid" id="grid" aria-label="Pixel art artifact variants"></section>
  </main>
  <script id="collection-data" type="application/json">__COLLECTION_JSON__</script>
  <script>
    const data = JSON.parse(document.querySelector('#collection-data').textContent);
    const isPack = data.kind === 'pack';
    document.querySelector('#collection-kicker').textContent = isPack ? 'Pixel proof / asset pack' : 'Pixel proof / resolution set';
    document.querySelector('#title').textContent = data.title;
    document.querySelector('#count').textContent = `${data.items.length} ${isPack ? 'assets' : 'masters'}`;
    const sizes = data.items.map(item => `${item.artifact.width}x${item.artifact.height}`);
    document.querySelector('#range').textContent = [...new Set(sizes)].join(' / ');
    const grid = document.querySelector('#grid');
    grid.setAttribute('aria-label', isPack ? 'Pixel art asset pack' : 'Pixel art resolution variants');
    data.items.forEach(item => {
      const artifact = item.artifact;
      const flat = artifact.grid.flat();
      const usage = new Map(artifact.palette.map(color => [color, flat.filter(cell => cell === color).length]));
      const article = document.createElement('article');
      const head = document.createElement('div'); head.className = 'card-head';
      const label = document.createElement('span'); label.className = 'size'; label.textContent = isPack ? artifact.title : `${artifact.width} x ${artifact.height}`;
      const colorCount = document.createElement('span'); colorCount.textContent = `${artifact.palette.length} colors`;
      head.append(label, colorCount);
      const stage = document.createElement('div'); stage.className = 'stage';
      const proof = document.createElement('div'); proof.className = 'proof';
      const canvas = document.createElement('canvas'); canvas.tabIndex = 0; canvas.setAttribute('aria-label', `${artifact.title}, ${artifact.width} by ${artifact.height} pixel art`);
      proof.appendChild(canvas); stage.appendChild(proof);
      function renderCanvas() {
        const styles = getComputedStyle(stage);
        const horizontalChrome = parseFloat(styles.paddingLeft) + parseFloat(styles.paddingRight) + 24;
        const verticalChrome = parseFloat(styles.paddingTop) + parseFloat(styles.paddingBottom) + 24;
        const available = Math.max(artifact.width, Math.min(256, stage.clientWidth - horizontalChrome, stage.clientHeight - verticalChrome));
        const scale = Math.max(1, Math.floor(available / Math.max(artifact.width, artifact.height)));
        canvas.width = artifact.width * scale; canvas.height = artifact.height * scale;
        const context = canvas.getContext('2d');
        artifact.grid.forEach((row,y) => row.forEach((color,x) => { if (color) { context.fillStyle=color; context.fillRect(x*scale,y*scale,scale,scale); } }));
      }
      new ResizeObserver(renderCanvas).observe(stage);
      requestAnimationFrame(renderCanvas);
      const foot = document.createElement('div'); foot.className = 'card-foot';
      const tape = document.createElement('div'); tape.className = 'tape'; tape.setAttribute('aria-label','Color usage distribution');
      artifact.palette.forEach(color => { const segment=document.createElement('span'); segment.style.background=color; segment.style.flexGrow=String(Math.max(1,usage.get(color)||0)); segment.title=`${color}: ${usage.get(color)||0} cells`; tape.appendChild(segment); });
      const facts = document.createElement('div'); facts.className = 'facts';
      const painted = document.createElement('span'); painted.textContent = isPack ? `${artifact.width} x ${artifact.height}` : `${flat.filter(Boolean).length} painted`;
      const source = document.createElement('span'); source.textContent = artifact.source?.kind || 'spec';
      facts.append(painted,source);
      const open = document.createElement('a'); open.className='open'; open.href=`${item.path}/index.html`; open.textContent='Open exact proof';
      foot.append(tape,facts,open); article.append(head,stage,foot); grid.appendChild(article);
    });
    window.__PIXEL_ART_COLLECTION_METRICS__ = { count:data.items.length, sizes };
    window.__PIXEL_ART_COLLECTION_READY__ = true;
  </script>
</body>
</html>
