<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesa de construcción</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101923;color:#dbe5e4;font:15px system-ui}main{max-width:1160px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 6px}p{color:#a5b9bd;line-height:1.5}header{margin-bottom:22px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px}.board{background:#26333a;overflow:auto;padding:24px;min-height:440px;border:1px solid #49616b}canvas{image-rendering:pixelated;display:block}#native{margin-bottom:24px}label{display:block;margin:14px 0 6px}select,button{font:inherit;background:#253a46;color:#eff6ee;border:1px solid #66828a;padding:8px;max-width:100%}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #f3c776;outline-offset:3px}ul{padding-left:20px;line-height:1.6}.pass{color:#95c6a8}.fail{color:#f4a08e}code{overflow-wrap:anywhere;font-size:11px}a{color:#f3c776}.hint{font-size:12px}#read{color:#edf1da}#part-info{white-space:pre-wrap;font:12px monospace}
</style>
<main><header><h1>Mesa de construcción</h1><p id="read"></p><a href="index.html">Abrir la prueba de píxeles</a></header><div class="layout"><section class="board" aria-label="Dibujo"><canvas id="native" aria-label="Tamaño nativo"></canvas><canvas id="large" aria-label="Vista ampliada"></canvas></section><aside><strong id="stage"></strong><p class="hint">La revisión de esta etapa se registra después de observarla. Los controles geométricos no califican el dibujo.</p><label for="mode">Vista</label><select id="mode"><option value="color">Color</option><option value="value">Valores</option><option value="silhouette">Silueta</option><option value="owner">Partes visibles</option></select><label for="part">Parte</label><select id="part"><option value="">Conjunto</option></select><label for="scale">Ampliación</label><select id="scale"><option>2</option><option>4</option><option selected>6</option><option>8</option></select><p id="part-info"></p><strong>Relaciones declaradas</strong><ul id="checks"></ul><details><summary>Huella de la fuente</summary><code id="fingerprint"></code></details></aside></div></main>
<script id="construction-data" type="application/json">__CONSTRUCTION__</script>
<script>
const data=JSON.parse(document.getElementById('construction-data').textContent),source=data.source,report=data.report;
const native=document.getElementById('native'),large=document.getElementById('large'),mode=document.getElementById('mode'),part=document.getElementById('part'),scale=document.getElementById('scale');
document.getElementById('read').textContent=source.intent;document.getElementById('stage').textContent=({block:'Bloques',planes:'Planos',material:'Materiales'})[source.stage]+' · borrador';document.getElementById('fingerprint').textContent=report.source_fingerprint;
for(const p of source.parts){const o=document.createElement('option');o.value=p.id;o.textContent=p.id;part.append(o)}
for(const c of report.checks){const li=document.createElement('li');li.className=c.passed?'pass':'fail';li.textContent=(c.passed?'✓ ':'✕ ')+c.id;document.getElementById('checks').append(li)}
const ownerColors=['#d17b72','#7fb4b1','#dfc183','#b9a1ce','#8bbb84','#849ecb','#dbaa7b'];
function grayColor(c){const q=[1,3,5].map(j=>parseInt(c.slice(j,j+2),16));const v=Math.round(q[0]*.2126+q[1]*.7152+q[2]*.0722);return `rgb(${v},${v},${v})`}
if(source.height>64)scale.value='4';
function draw(){native.width=large.width=source.width;native.height=large.height=source.height;native.style.width=source.width+'px';native.style.height=source.height+'px';large.style.width=source.width*Number(scale.value)+'px';large.style.height=source.height*Number(scale.value)+'px';const ctx=native.getContext('2d');ctx.imageSmoothingEnabled=false;if(report.background){ctx.fillStyle=mode.value==='value'?grayColor(report.background):report.background;ctx.fillRect(0,0,source.width,source.height)}
source.parts.forEach((p,i)=>{const [ox,oy]=report.origins[p.id];for(let y=0;y<p.grid.length;y++)for(let x=0;x<p.grid[y].length;x++){const a=p.grid[y][x];if(a==='.')continue;let c=report.palette[a];if(mode.value==='value')c=grayColor(c);if(mode.value==='silhouette')c=p.role==='environment'?'#26333a':'#e2e4d1';if(mode.value==='owner')c=ownerColors[i%ownerColors.length];if(part.value&&part.value!==p.id)c='#43535b';ctx.fillStyle=c;ctx.fillRect(ox+x,oy+y,1,1)}});
const big=large.getContext('2d');big.imageSmoothingEnabled=false;big.drawImage(native,0,0);const info=part.value?{origin:report.origins[part.value],anchors:report.anchors[part.value],visible_cells:report.owner.flat().filter(v=>v===part.value).length}:null;document.getElementById('part-info').textContent=info?JSON.stringify(info,null,2):'Selecciona una parte para localizar sus anclajes. Las partes ocultas conservan su máscara en la fuente.';
}mode.addEventListener('change',draw);part.addEventListener('change',draw);scale.addEventListener('change',draw);draw();
</script></html>
